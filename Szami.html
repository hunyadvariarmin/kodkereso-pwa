function applyDoneStyles() {

    const buttons =
        document.querySelectorAll(
            "#buttonsContainer button"
        );

    buttons.forEach(btn => {

        btn.style.backgroundColor =
            "rgba(0,0,0,0.4)";

        btn.style.borderColor =
            "#FFD700";

        btn.style.color =
            "#FFD700";
    });


    DONE_KEYS.forEach(key => {

        if (
            localStorage.getItem(key)
            === "true"
        ) {

            const code =
                key.replace("done_", "");

            const btn =
                document.querySelector(
                    `button[data-code="${code}"]`
                );

            if (btn) {

                btn.style.backgroundColor =
                    "rgba(0,128,0,0.7)";

                btn.style.borderColor =
                    "#00ff00";

                btn.style.color =
                    "#ffffff";
            }
        }
    });
}


/* =========================
   EXCEL ALAPÚ LÁTHATÓSÁG
   ========================= */

async function updateButtonsVisibilityFromExcel() {

    let excelBaseTours =
        new Set();

    try {

        const resp =
            await fetch(XLSX_URL);

        const buffer =
            await resp.arrayBuffer();

        const wb =
            XLSX.read(
                buffer,
                { type:"array" }
            );

        const sheet =
            wb.Sheets[
                wb.SheetNames[0]
            ];

        const data =
            XLSX.utils.sheet_to_json(
                sheet,
                { header:1 }
            );


        for (
            let i = 1;
            i < data.length;
            i++
        ) {

            const row =
                data[i] || [];

            const val =
                row[2];

            if (val == null)
                continue;


            let norm =
                String(val)
                    .trim()
                    .toUpperCase();

            if (
                !norm.startsWith("SZ-")
            )
                continue;


            norm =
                norm.replace(
                    /\s+/g,
                    ""
                );


            const numStr =
                norm.slice(3);

            if (
                !/^\d+$/.test(numStr)
            )
                continue;


            const rawNum =
                parseInt(
                    numStr,
                    10
                );

            if (isNaN(rawNum))
                continue;


            let baseNum;


            if (rawNum >= 8000) {

                baseNum =
                    rawNum - 8000;

            } else if (rawNum >= 800) {

                baseNum =
                    rawNum - 800;

            } else {

                baseNum =
                    rawNum;
            }


            const baseCode =
                "SZ-" + baseNum;

            excelBaseTours.add(
                baseCode.toUpperCase()
            );
        }

    } catch (e) {

        console.error(
            "Excel betöltési hiba:",
            e
        );

        return;
    }


    if (
        excelBaseTours.size === 0
    ) {

        console.warn(
            "Nem találtam SZ túrákat az Excelben."
        );

        return;
    }


    const buttons =
        document.querySelectorAll(
            "#buttonsContainer button"
        );


    buttons.forEach(btn => {

        const code =
            btn.getAttribute(
                "data-code"
            );

        if (!code)
            return;


        const upperCode =
            code.toUpperCase();


        if (
            excelBaseTours.has(
                upperCode
            )
        ) {

            btn.style.display =
                "";

        } else {

            btn.style.display =
                "none";
        }
    });
}


/* =========================
   OLDAL INDÍTÁSA
   ========================= */

window.addEventListener(
    "DOMContentLoaded",
    () => {

        applyDoneStyles();

        updateButtonsVisibilityFromExcel();


        document

                    );


                    SCAN_KEYS.forEach(
                        k =>
                            sessionStorage.removeItem(k)
                    );


                    applyDoneStyles();
                }
            );
    }
);

(function () {

       ========================= */

    function massNormalizeCode(value) {

        if (value == null)
            return "";

        return String(value)
            .trim()
            .toUpperCase()
            .replace(/\s+/g, "")
            .replace(/[–—]/g, "-");
    }


    /* =========================
       TÚRA ÁTALAKÍTÁS
       ========================= */

    function massConvertTour(value) {

        let norm =
            massNormalizeCode(value);


        if (
            !norm.startsWith("SZ-")
        )
            return null;


        const numStr =
            norm.slice(3);


        if (
            !/^\d+$/.test(numStr)
        )
            return null;


        const rawNum =
            parseInt(
                numStr,
                10
            );


        if (isNaN(rawNum))
            return null;


        let baseNum;


        if (rawNum >= 8000) {

            baseNum =
                rawNum - 8000;

        } else if (rawNum >= 800) {

            baseNum =
                rawNum - 800;

        } else {

            baseNum =
                rawNum;
        }


        return "SZ-" + baseNum;
    }


    /* =========================
       EXCEL BETÖLTÉS
       ========================= */

        ) {

            );

        const buffer =

                { type:"array" }
            );


        const sheet =
            workbook.Sheets[
                workbook.SheetNames[0]
            ];


        const rows =
            XLSX.utils.sheet_to_json(
                sheet,
                { header:1 }
            );


        const codeToTour =
            new Map();

        const tourCodes =
            new Map();


        for (
            let i = 1;
            i < rows.length;
            i++
        ) {

            const row =
                rows[i] || [];


            const code =
                massNormalizeCode(
                    row[0]
                );


            const tour =
                massConvertTour(
                    row[2]
                );


            if (
                !code ||
                !tour
            )
                continue;


            codeToTour.set(
                code,
                tour
            );


            if (
                !tourCodes.has(tour)
            ) {

                tourCodes.set(
                    tour,
                    new Set()
                );
            }


            tourCodes
                .get(tour)
                .add(code);
        }


        massExcelData = {

            codeToTour,

            tourCodes
        };


        return massExcelData;
    }


    /* =========================
       SESSION STORAGE
       ========================= */

    function massGetScanKey(tour) {

        return tour +
            "_scannedList";
    }


    function massGetStoredList(tour) {

        let list = [];


        try {

            const stored =
                sessionStorage.getItem(
                    massGetScanKey(tour)
                );


            if (stored) {

                const parsed =
                    JSON.parse(stored);


                if (
                    Array.isArray(parsed)
                ) {

                    list = parsed;
                }
            }

        } catch (e) {

            console.error(
                "scanned lista olvasási hiba",
                e
            );
        }


        return list;
    }


    function massSetStoredList(
        tour,
        list
    ) {

        sessionStorage.setItem(

            massGetScanKey(tour),

            JSON.stringify(list)
        );
    }


    /* =========================
       ÖSSZESÍTÉS
       ========================= */

    function massUpdateSummary() {

        document
            .getElementById(
                "massTotalCount"
            )
            .textContent =
                massTotalScanned;


        const summary =
            document.getElementById(
                "massSummaryList"
            );


        const tours =
            Object.keys(
                massTourCounts
            ).sort(
                function (a,b) {

                    const na =
                        parseInt(
                            a.replace(
                                "SZ-",
                                ""
                            ),
                            10
                        );

                    const nb =
                        parseInt(
                            b.replace(
                                "SZ-",
                                ""
                            ),
                            10
                        );

                    return na - nb;
                }
            );


        if (
            tours.length === 0
        ) {

            summary.textContent =
                "Nincs még beolvasott kód.";

            return;
        }


        summary.innerHTML = "";


        tours.forEach(
            function (tour) {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "massSummaryRow";


                const tourSpan =
                    document.createElement(
                        "span"
                    );

                tourSpan.className =
                    "massSummaryTour";

                tourSpan.textContent =
                    tour;


                const countSpan =
                    document.createElement(
                        "span"
                    );

                countSpan.className =
                    "massSummaryCount";

                countSpan.textContent =
                    massTourCounts[tour] +
                    " db";


                row.appendChild(
                    tourSpan
                );

                row.appendChild(
                    countSpan
                );


                summary.appendChild(
                    row
                );
            }
        );
    }


    /* =========================
       ÁLLAPOT
       ========================= */

    function massSetStatus(
        type,
        text
    ) {

        const status =
            document.getElementById(
                "massScanStatus"
            );


        status.className =
            "mass-status-" +
            type;


        status.textContent =
            text;
    }


    /* =========================
       HANGOK
       ========================= */

    function massBeepSuccess() {

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            const ctx =
                new AudioContext();

            const oscillator =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            oscillator.frequency.value =
                1000;

            oscillator.type =
                "sine";

            gain.gain.value =
                0.15;

            oscillator.connect(gain);
            gain.connect(ctx.destination);

            oscillator.start();

            oscillator.stop(
                ctx.currentTime + 0.12
            );

        } catch (e) {}
    }


    function massBeepWarning() {

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            const ctx =
                new AudioContext();

            const oscillator =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            oscillator.frequency.value =
                500;

            oscillator.type =
                "sine";

            gain.gain.value =
                0.12;

            oscillator.connect(gain);
            gain.connect(ctx.destination);

            oscillator.start();

            oscillator.stop(
                ctx.currentTime + 0.18
            );

        } catch (e) {}
    }


    function massBeepError() {

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            const ctx =
                new AudioContext();

            const oscillator =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            oscillator.frequency.value =
                250;

            oscillator.type =
                "square";

            gain.gain.value =
                0.15;

            oscillator.connect(gain);
            gain.connect(ctx.destination);

            oscillator.start();

            oscillator.stop(
                ctx.currentTime + 0.25
            );

        } catch (e) {}
    }


    /* =========================
       TÚRA ELLENŐRZÉS
       ========================= */

    function massCheckTourDone(
        tour,
        scannedList
    ) {

        if (!massExcelData)
            return;


        const tourCodes =
            massExcelData.tourCodes
                .get(tour);


        if (!tourCodes)
            return;


        const scannedSet =
            new Set(
                scannedList.map(
                    function (code) {

                        return massNormalizeCode(
                            code
                        );
                    }
                )
            );


        for (
            const code of tourCodes
        ) {

            if (
                !scannedSet.has(code)
            ) {

                return;
            }
        }


        localStorage.setItem(
            "done_" + tour,
            "true"
        );


        if (
            typeof applyDoneStyles
            === "function"
        ) {

            applyDoneStyles();
        }
    }


    /* =========================
       KÓD FELDOLGOZÁSA
       ========================= */

    function processMassCode(
        decodedText
    ) {

        const code =
            massNormalizeCode(
                decodedText
            );


        if (
            !code ||
            !massExcelData
        )
            return;


        const tour =
            massExcelData.codeToTour
                .get(code);


        if (!tour) {

            massSetStatus(
                "error",
                "NEM TALÁLHATÓ: " +
                code
            );

            massBeepError();

            return;
        }


        const scannedList =
            massGetStoredList(
                tour
            );


        const alreadyScanned =
            scannedList.some(
                function (item) {

                    return (
                        massNormalizeCode(
                            item
                        ) === code
                    );
                }
            );


        if (alreadyScanned) {

            massSetStatus(
                "info",
                "MÁR ELLENŐRIZVE: " +
                code +
                " › " +
                tour
            );

            massBeepWarning();

            return;
        }


        scannedList.push(
            code
        );


        massSetStoredList(
            tour,
            scannedList
        );


        massTotalScanned++;


        if (
            !massTourCounts[tour]
        ) {

            massTourCounts[tour] =
                0;
        }


        massTourCounts[tour]++;


        massCheckTourDone(
            tour,
            scannedList
        );


        massUpdateSummary();


        massSetStatus(
            "success",
            code +
            " › " +
            tour
        );


        massBeepSuccess();
    }


    /* =========================
       QR SIKER
       ========================= */

    function onMassScanSuccess(
        decodedText
    ) {

        if (
            !massScannerRunning
        )
            return;


        const code =
            massNormalizeCode(
                decodedText
            );


        if (!code)
            return;


        if (
            massRecentlyScanned.has(
                code
            )
        ) {

            return;
        }


        massRecentlyScanned.add(
            code
        );


        setTimeout(
            function () {

                massRecentlyScanned.delete(
                    code
                );

            },
            1500
        );


        processMassCode(
            code
        );
    }


    /* =========================
       KAMERA LEÁLLÍTÁSA
       ========================= */

    async function stopMassScanner() {

        massScannerRunning =
            false;


        if (!massQrReader)
            return;


        try {

            await massQrReader.stop();

        } catch (e) {

            console.warn(
                "Kamera leállítás:",
                e
            );
        }


        try {

            massQrReader.clear();

        } catch (e) {}


        massQrReader =
            null;
    }


    /* =========================
       KAMERA INDÍTÁSA
       ========================= */

    async function startMassScanner() {

        await stopMassScanner();


        const readerElement =
            document.getElementById(
                "massReader"
            );


        readerElement.style.display =
            "block";

        readerElement.innerHTML =
            "";


        if (
            typeof Html5Qrcode ===
            "undefined"
        ) {

            massSetStatus(
                "error",
                "A kameraolvasó nem töltődött be."
            );

            return;
        }


        massQrReader =
            new Html5Qrcode(
                "massReader"
            );


        const formats = [];


        if (
            typeof Html5QrcodeSupportedFormats
            !== "undefined"
        ) {

            [
                "QR_CODE",
                "CODE_128",
                "CODE_39",
                "CODE_93",
                "CODABAR",
                "EAN_13",
                "EAN_8",
                "ITF",
                "UPC_A",
                "UPC_E"
            ].forEach(
                function (name) {

                    if (
                        Html5QrcodeSupportedFormats[
                            name
                        ] !== undefined
                    ) {

                        formats.push(
                            Html5QrcodeSupportedFormats[
                                name
                            ]
                        );
                    }
                }
            );
        }


        const config = {

            fps:10,

            aspectRatio:1.0
        };


        if (
            formats.length > 0
        ) {

            config.formatsToSupport =
                formats;
        }


        try {

            await massQrReader.start(

                {
                    facingMode:{
                        exact:"environment"
                    }
                },

                config,

                onMassScanSuccess,

                function () {}
            );


            massScannerRunning =
                true;


            massSetStatus(
                "info",
                "Keresem a QR- vagy vonalkódot..."
            );


        } catch (firstError) {

            console.warn(
                "Első kameraindítás sikertelen:",
                firstError
            );


            try {

                await massQrReader.clear();

            } catch (e) {}


            massQrReader =
                new Html5Qrcode(
                    "massReader"
                );


            try {

                await massQrReader.start(

                    {
                        facingMode:
                            "environment"
                    },

                    config,

                    onMassScanSuccess,

                    function () {}
                );


                massScannerRunning =
                    true;


                massSetStatus(
                    "info",
                    "Keresem a QR- vagy vonalkódot..."
                );


            } catch (secondError) {

                console.error(
                    "Tömeges kamera indítási hiba:",
                    secondError
                );


                massSetStatus(
                    "error",
                    "Nem sikerült elindítani a kamerát."
                );
            }
        }
    }


    /* =========================
       KÉZI BEVITEL AKTIVÁLÁSA
       ========================= */

    async function switchToManual() {

        await stopMassScanner();


        document.getElementById(
            "massReader"
        ).style.display =
            "none";


        document.getElementById(
            "manualInputArea"
        ).style.display =
            "block";


        document.getElementById(
            "switchManualButton"
        ).style.display =

        document.getElementById(

        ).style.display =

            document.getElementById(

    /* =========================
       VISSZA KAMERÁRA
       ========================= */

    async function switchToCamera() {

        document.getElementById(
            "manualInputArea"
        ).style.display =
            "none";


        document.getElementById(
            "switchCameraButton"
        ).style.display =
            "none";


        document.getElementById(
            "switchManualButton"
        ).style.display =
            "block";


        document.getElementById(
            "massReader"
        ).style.display =
            "block";


        massSetStatus(
            "info",
            "Kamera indítása..."
        );

    }


    /* =========================
       KÉZI KÓD BEVITELE
       ========================= */

    function setupManualInput() {

        const input =
            document.getElementById(
                "manualCodeInput"
            );


        input.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key !== "Enter"
                )
                    return;


                event.preventDefault();


                const code =
                    input.value.trim();


                input.value = "";


                if (code) {

                    processMassCode(
                        code
                    );
                }


                /*
                 * Nagyon fontos:
                 * a vonalkódolvasó ENTER után
                 * azonnal visszakapja a fókuszt.
                 */

                setTimeout(
                    function () {

                        input.focus();

                    },
                    20
                );
            }
        );


        /*
         * Ha a scanner valamiért nem küld
         * ENTER-t, akkor a mező akkor is
         * használható marad.
         */
    }


    /* =========================
       TÖMEGES ABLAK MEGNYITÁSA
       ========================= */

    async function openMassCheck() {

        const modal =
            document.getElementById(
                "massCheckModal"
            );


        modal.style.display =
            "block";


        massTotalScanned =
            0;


        massTourCounts =
            {};


        massRecentlyScanned =
            new Set();


        /*
         * Mindig kamera móddal indulunk.
         */

        document.getElementById(
            "massReader"
        ).style.display =
            "block";


        document.getElementById(
            "manualInputArea"
        ).style.display =
            "none";


        document.getElementById(
            "switchManualButton"
        ).style.display =
            "block";


        document.getElementById(
            "switchCameraButton"
        ).style.display =
            "none";


        document.getElementById(
            "manualCodeInput"
        ).value = "";


        massUpdateSummary();


        massSetStatus(
            "info",
            "Excel adatok betöltése..."
        );


        try {

            await loadMassExcelData();

        } catch (error) {

            console.error(error);


            massSetStatus(
                "error",
                "Nem sikerült betölteni az Excel fájlt."
            );


            return;
        }


        massSetStatus(
            "info",
            "Kamera indítása..."
        );


        await startMassScanner();
    }


    /* =========================
       TÖMEGES ABLAK BEZÁRÁSA
       ========================= */

    async function closeMassCheck() {

        await stopMassScanner();


        document.getElementById(
            "massCheckModal"
        ).style.display =
            "none";


        document.getElementById(
            "massReader"
        ).innerHTML =
            "";


        document.getElementById(
            "massReader"
        ).style.display =
            "block";


        document.getElementById(
            "manualInputArea"
        ).style.display =
            "none";


        document.getElementById(
            "switchManualButton"
        ).style.display =
            "block";


        document.getElementById(
            "switchCameraButton"
        ).style.display =
            "none";


        document.getElementById(
            "manualCodeInput"
        ).value = "";
    }


    /* =========================
       GOMBOK
       ========================= */

    window.addEventListener(
        "DOMContentLoaded",
        function () {

            /*
             * Kézi bevitel beállítása
             */
            setupManualInput();


            /*
             * Tömeges ellenőrzés
             */
            const massButton =
                document.getElementById(
                    "massCheckButton"
                );

            if (massButton) {

                massButton.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();

                        openMassCheck();
                    }
                );
            }


            /*
             * Kézi mód
             */
            const manualButton =
                document.getElementById(
                    "switchManualButton"
                );

            if (manualButton) {

                manualButton.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();

                        switchToManual();
                    }
                );
            }


            /*
             * Kamera mód
             */
            const cameraButton =
                document.getElementById(
                    "switchCameraButton"
                );

            if (cameraButton) {

                cameraButton.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();

                        switchToCamera();
                    }
                );
            }


            /*
             * Bezárás
             */
            const closeButton =
                document.getElementById(
                    "closeMassCheck"
                );

            if (closeButton) {

                closeButton.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();

                        closeMassCheck();
                    }
                );
            }
        }
    );

})();
