<script>

/* ============================================================
   EREDETI / KÖZÖS BEÁLLÍTÁSOK
   ============================================================ */

const XLSX_URL =
    "https://raw.githubusercontent.com/hunyadvariarmin/kodkereso-pwa/main/1.xlsx";


/* ============================================================
   DONE JELÖLÉSEK
   ============================================================ */

const DONE_KEYS = [
    "done_SZ-1000",
    "done_SZ-2",
    "done_SZ-3",
    "done_SZ-4",
    "done_SZ-0",
    "done_SZ-7",
    "done_SZ-9",
    "done_SZ-10",
    "done_SZ-101",
    "done_SZ-1",
    "done_SZ-5",
    "done_SZ-12",
    "done_SZ-14",
    "done_SZ-15",
    "done_SZ-18",
    "done_SZ-19",
    "done_SZ-20",
    "done_SZ-21",
    "done_SZ-22",
    "done_SZ-23",
    "done_SZ-25",
    "done_SZ-26",
    "done_SZ-27",
    "done_SZ-28",
    "done_SZ-29",
    "done_SZ-30",
    "done_SZ-32",
    "done_SZ-33",
    "done_SZ-34",
    "done_SZ-35",
    "done_SZ-36",
    "done_SZ-37",
    "done_SZ-38",
    "done_SZ-40",
    "done_SZ-50",
    "done_SZ-60",
    "done_SZ-70",
    "done_SZ-54"
];


/* ============================================================
   SCAN KULCS
   ============================================================ */

function getScanKey(tour) {
    return tour + "_scannedList";
}


/* ============================================================
   KÓD NORMALIZÁLÁSA
   ============================================================ */

function normalizeCode(value) {

    if (value == null) {
        return "";
    }

    return String(value)
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "")
        .replace(/[–—]/g, "-");
}


/* ============================================================
   EXCEL TÚRA ÁTALAKÍTÁSA
   SZ-2   → SZ-2
   SZ-802 → SZ-2
   SZ-823 → SZ-23
   SZ-835 → SZ-35
   SZ-860 → SZ-60
   SZ-8101 → SZ-101
   ============================================================ */

function convertExcelTour(value) {

    let norm = normalizeCode(value);

    if (!norm.startsWith("SZ-")) {
        return null;
    }

    const numStr = norm.slice(3);

    if (!/^\d+$/.test(numStr)) {
        return null;
    }

    const rawNum = parseInt(numStr, 10);

    if (isNaN(rawNum)) {
        return null;
    }

    let baseNum;

    if (rawNum >= 8000) {
        baseNum = rawNum - 8000;
    }
    else if (rawNum >= 800) {
        baseNum = rawNum - 800;
    }
    else {
        baseNum = rawNum;
    }

    return "SZ-" + baseNum;
}


/* ============================================================
   SCAN ADATOK
   ============================================================ */

const SCAN_KEYS = DONE_KEYS.map(key =>
    key.replace("done_", "") + "_scannedList"
);


/* ============================================================
   EREDETI ZÖLDÍTÉS
   ============================================================ */

function applyDoneStyles() {

    const buttons =
        document.querySelectorAll("#buttonsContainer button");

    buttons.forEach(btn => {

        btn.style.backgroundColor = "rgba(0,0,0,0.4)";
        btn.style.borderColor = "#FFD700";
        btn.style.color = "#FFD700";

    });

    DONE_KEYS.forEach(key => {

        if (localStorage.getItem(key) === "true") {

            const code = key.replace("done_", "");

            const btn =
                document.querySelector(
                    `button[data-code="${code}"]`
                );

            if (btn) {

                btn.style.backgroundColor =
                    "rgba(0,128,0,0.7)";

                btn.style.borderColor =
                    "#00ff00";

                btn.style.color =
                    "#ffffff";
            }
        }
    });
}


/* ============================================================
   EXCEL ALAPJÁN GOMBOK MUTATÁSA
   ============================================================ */

async function updateButtonsVisibilityFromExcel() {

    let excelBaseTours = new Set();

    try {

        const resp = await fetch(XLSX_URL);

        const buffer =
            await resp.arrayBuffer();

        const wb =
            XLSX.read(buffer, { type: "array" });

        const sheet =
            wb.Sheets[wb.SheetNames[0]];

        const data =
            XLSX.utils.sheet_to_json(
                sheet,
                { header: 1 }
            );

        for (let i = 1; i < data.length; i++) {

            const row = data[i] || [];

            const val = row[2];

            if (val == null) {
                continue;
            }

            const baseCode =
                convertExcelTour(val);

            if (baseCode) {

                excelBaseTours.add(
                    baseCode.toUpperCase()
                );
            }
        }

    }
    catch (e) {

        console.error(
            "Excel betöltési hiba a Szami oldalon:",
            e
        );

        return;
    }


    if (excelBaseTours.size === 0) {

        console.warn(
            "Nem találtam SZ túrákat az Excelben."
        );

        return;
    }


    const buttons =
        document.querySelectorAll(
            "#buttonsContainer button"
        );


    buttons.forEach(btn => {

        const code =
            btn.getAttribute("data-code");

        if (!code) {
            return;
        }

        const upperCode =
            code.toUpperCase();


        if (excelBaseTours.has(upperCode)) {

            btn.style.display = "";

        }
        else {

            btn.style.display = "none";

        }

    });
}


/* ============================================================
   ============================================================
   TÖMEGES ELLENŐRZÉS – PLUSZ FUNKCIÓ
   ============================================================
   ============================================================ */


/* ============================================================
   TÖMEGES EXCEL ADATOK
   ============================================================ */

let massExcelData = null;


/* ============================================================
   EXCEL BETÖLTÉSE
   A = QR / vonalkód
   C = túrakód
   ============================================================ */

async function loadMassExcelData() {

    if (massExcelData !== null) {

        return massExcelData;
    }


    const response =
        await fetch(XLSX_URL);


    if (!response.ok) {

        throw new Error(
            "Nem sikerült betölteni az Excel fájlt."
        );
    }


    const buffer =
        await response.arrayBuffer();


    const workbook =
        XLSX.read(
            buffer,
            { type: "array" }
        );


    const sheet =
        workbook.Sheets[
            workbook.SheetNames[0]
        ];


    const data =
        XLSX.utils.sheet_to_json(
            sheet,
            { header: 1 }
        );


    const codeToTour = new Map();

    const tourCodes = new Map();


    for (let i = 1; i < data.length; i++) {

        const row = data[i] || [];

        /* A oszlop */
        const code =
            normalizeCode(row[0]);

        /* C oszlop */
        const rawTour =
            row[2];


        if (!code || rawTour == null) {

            continue;
        }


        const tour =
            convertExcelTour(rawTour);


        if (!tour) {

            continue;
        }


        /* KÓD → TÚRA */

        codeToTour.set(
            code,
            tour
        );


        /* TÚRA → KÓDOK */

        if (!tourCodes.has(tour)) {

            tourCodes.set(
                tour,
                new Set()
            );
        }


        tourCodes
            .get(tour)
            .add(code);
    }


    massExcelData = {
        codeToTour,
        tourCodes
    };


    return massExcelData;
}


/* ============================================================
   TÖMEGES VÁLTOZÓK
   ============================================================ */

let massHtml5QrCode = null;

let massCheckRunning = false;

let massTotalScanned = 0;

let massTourCounts = {};

let massRecentlyScanned = new Set();


/* ============================================================
   TÖMEGES ELLENŐRZÉS MEGNYITÁSA
   ============================================================ */

async function openMassCheck() {

    const modal =
        document.getElementById(
            "massCheckModal"
        );

    const status =
        document.getElementById(
            "scanStatus"
        );


    modal.style.display = "block";


    status.className =
        "status-info";

    status.textContent =
        "Excel adatok betöltése...";


    try {

        await loadMassExcelData();

    }
    catch (error) {

        console.error(error);

        status.className =
            "status-error";

        status.textContent =
            "❌ Nem sikerült betölteni az Excel fájlt.";

        return;
    }


    massTotalScanned = 0;

    massTourCounts = {};

    massRecentlyScanned =
        new Set();


    updateMassSummary();


    status.className =
        "status-info";

    status.textContent =
        "📷 Kamera indítása...";


    startMassScanner();
}


/* ============================================================
   KAMERA INDÍTÁSA
   ============================================================ */

function startMassScanner() {

    if (massHtml5QrCode) {

        try {
            massHtml5QrCode.stop();
        }
        catch (e) {}

    }


    massHtml5QrCode =
        new Html5Qrcode("reader");


    const config = {

        fps: 10,

        qrbox:
            function(
                viewfinderWidth,
                viewfinderHeight
            ) {

                const size =
                    Math.min(
                        viewfinderWidth,
                        viewfinderHeight
                    ) * 0.7;


                return {
                    width: size,
                    height: size
                };
            },

        aspectRatio: 1.0,

        /* QR + vonalkód formátumok */

        formatsToSupport: [

            Html5QrcodeSupportedFormats.QR_CODE,

            Html5QrcodeSupportedFormats.CODE_128,

            Html5QrcodeSupportedFormats.CODE_39,

            Html5QrcodeSupportedFormats.CODE_93,

            Html5QrcodeSupportedFormats.CODABAR,

            Html5QrcodeSupportedFormats.EAN_13,

            Html5QrcodeSupportedFormats.EAN_8,

            Html5QrcodeSupportedFormats.ITF,

            Html5QrcodeSupportedFormats.UPC_A,

            Html5QrcodeSupportedFormats.UPC_E

        ]
    };


    massHtml5QrCode.start(

        {
            facingMode: {
                exact: "environment"
            }
        },

        config,

        onMassScanSuccess,

        function(errorMessage) {

            /* normál esetben nincs teendő */

        }

    )
    .then(() => {

        massCheckRunning = true;

        const status =
            document.getElementById(
                "scanStatus"
            );

        status.className =
            "status-info";

        status.textContent =
            "📷 Keresem a QR-kódot / vonalkódot...";

    })
    .catch(error => {

        console.error(
            "Kamera indítási hiba:",
            error
        );

        startMassScannerFallback();

    });
}


/* ============================================================
   KAMERA TARTALÉK MÓD
   ============================================================ */

function startMassScannerFallback() {

    if (massHtml5QrCode) {

        try {

            massHtml5QrCode.clear();

        }
        catch (e) {}

    }


    massHtml5QrCode =
        new Html5Qrcode("reader");


    const config = {

        fps: 10,

        qrbox: {
            width: 250,
            height: 250
        },

        aspectRatio: 1.0,

        formatsToSupport: [

            Html5QrcodeSupportedFormats.QR_CODE,

            Html5QrcodeSupportedFormats.CODE_128,

            Html5QrcodeSupportedFormats.CODE_39,

            Html5QrcodeSupportedFormats.CODE_93,

            Html5QrcodeSupportedFormats.CODABAR,

            Html5QrcodeSupportedFormats.EAN_13,

            Html5QrcodeSupportedFormats.EAN_8,

            Html5QrcodeSupportedFormats.ITF,

            Html5QrcodeSupportedFormats.UPC_A,

            Html5QrcodeSupportedFormats.UPC_E

        ]
    };


    massHtml5QrCode.start(

        {
            facingMode: "environment"
        },

        config,

        onMassScanSuccess,

        function(errorMessage) {}

    )
    .then(() => {

        massCheckRunning = true;

        const status =
            document.getElementById(
                "scanStatus"
            );

        status.className =
            "status-info";

        status.textContent =
            "📷 Keresem a QR-kódot / vonalkódot...";

    })
    .catch(error => {

        console.error(error);

        const status =
            document.getElementById(
                "scanStatus"
            );

        status.className =
            "status-error";

        status.textContent =
            "❌ Nem sikerült elindítani a kamerát.";

    });
}


/* ============================================================
   BEOLVASÁS
   ============================================================ */

function onMassScanSuccess(decodedText) {

    if (!massCheckRunning) {

        return;
    }


    const code =
        normalizeCode(decodedText);


    if (!code) {

        return;
    }


    /*
     * A kamera rövid idő alatt
     * többször is felismerheti ugyanazt.
     */

    if (
        massRecentlyScanned.has(code)
    ) {

        return;
    }


    massRecentlyScanned.add(code);


    setTimeout(() => {

        massRecentlyScanned.delete(code);

    }, 1500);


    processMassCode(code);
}


/* ============================================================
   KÓD FELDOLGOZÁSA
   ============================================================ */

function processMassCode(code) {

    const status =
        document.getElementById(
            "scanStatus"
        );


    const data =
        massExcelData;


    /*
     * A oszlopban keressük.
     */

    const tour =
        data.codeToTour.get(code);


    /* ========================================================
       NINCS TALÁLAT
       ======================================================== */

    if (!tour) {

        status.className =
            "status-error";

        status.textContent =
            "❌ NEM TALÁLHATÓ: " + code;

        beepError();

        return;
    }


    const scanKey =
        getScanKey(tour);


    /*
     * Meglévő sessionStorage lista
     */

    let scannedList = [];


    try {

        const stored =
            sessionStorage.getItem(
                scanKey
            );


        if (stored) {

            const parsed =
                JSON.parse(stored);


            if (Array.isArray(parsed)) {

                scannedList = parsed;

            }
        }

    }
    catch (e) {

        console.error(
            "Scanned lista olvasási hiba:",
            e
        );

    }


    /*
     * DUPLIKÁCIÓ
     */

    const alreadyScanned =
        scannedList.some(
            item =>
                normalizeCode(item) === code
        );


    if (alreadyScanned) {

        status.className =
            "status-info";

        status.textContent =
            "⚠️ MÁR ELLENŐRIZVE: " +
            code +
            " → " +
            tour;

        beepWarning();

        return;
    }


    /* ========================================================
       ÚJ KÓD
       ======================================================== */

    scannedList.push(code);


    sessionStorage.setItem(

        scanKey,

        JSON.stringify(
            scannedList
        )

    );


    /*
     * STATISZTIKA
     */

    massTotalScanned++;


    if (!massTourCounts[tour]) {

        massTourCounts[tour] = 0;

    }


    massTourCounts[tour]++;


    /*
     * Kész-e a túra?
     */

    checkMassTourDone(
        tour,
        scannedList
    );


    /*
     * Képernyő frissítés
     */

    updateMassSummary();


    status.className =
        "status-success";


    status.textContent =
        "✅ " +
        code +
        " → " +
        tour;


    beepSuccess();
}


/* ============================================================
   TÚRA KÉSZ-E?
   ============================================================ */

function checkMassTourDone(
    tour,
    scannedList
) {

    if (!massExcelData) {

        return;
    }


    const tourCodes =
        massExcelData.tourCodes.get(
            tour
        );


    if (!tourCodes) {

        return;
    }


    const scannedSet =
        new Set(
            scannedList.map(
                code =>
                    normalizeCode(code)
            )
        );


    let allDone = true;


    for (
        const code of tourCodes
    ) {

        if (
            !scannedSet.has(code)
        ) {

            allDone = false;

            break;
        }
    }


    if (allDone) {

        localStorage.setItem(
            "done_" + tour,
            "true"
        );


        /*
         * Az eredeti zöldítés használata.
         */

        applyDoneStyles();
    }
}


/* ============================================================
   ÖSSZESÍTÉS
   ============================================================ */

function updateMassSummary() {

    const totalElement =
        document.getElementById(
            "massTotalCount"
        );


    totalElement.textContent =
        massTotalScanned;


    const summary =
        document.getElementById(
            "summaryList"
        );


    const tours =
        Object.keys(
            massTourCounts
        )
        .sort((a, b) => {

            const na =
                parseInt(
                    a.replace("SZ-", ""),
                    10
                );


            const nb =
                parseInt(
                    b.replace("SZ-", ""),
                    10
                );


            return na - nb;
        });


    if (tours.length === 0) {

        summary.innerHTML =
            "Nincs még beolvasott kód.";

        return;
    }


    summary.innerHTML = "";


    tours.forEach(tour => {

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "summaryRow";


        const tourSpan =
            document.createElement(
                "span"
            );


        tourSpan.className =
            "summaryTour";


        tourSpan.textContent =
            tour;


        const countSpan =
            document.createElement(
                "span"
            );


        countSpan.className =
            "summaryCount";


        countSpan.textContent =
            massTourCounts[tour] +
            " db";


        row.appendChild(
            tourSpan
        );


        row.appendChild(
            countSpan
        );


        summary.appendChild(
            row
        );

    });
}


/* ============================================================
   KAMERA LEÁLLÍTÁSA
   ============================================================ */

async function stopMassScanner() {

    massCheckRunning = false;


    if (!massHtml5QrCode) {

        return;
    }


    try {

        await massHtml5QrCode.stop();

    }
    catch (e) {

        console.warn(
            "Kamera leállítás:",
            e
        );

    }


    try {

        massHtml5QrCode.clear();

    }
    catch (e) {}


    massHtml5QrCode = null;
}


/* ============================================================
   TÖMEGES ELLENŐRZÉS BEZÁRÁSA
   ============================================================ */

async function closeMassCheck() {

    await stopMassScanner();


    document.getElementById(
        "massCheckModal"
    ).style.display = "none";


    document.getElementById(
        "reader"
    ).innerHTML = "";


    document.getElementById(
        "scanStatus"
    ).className =
        "status-info";


    document.getElementById(
        "scanStatus"
    ).textContent =
        "Kamera leállítva.";
}


/* ============================================================
   HANGJELZÉSEK
   ============================================================ */

function beepSuccess() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const ctx =
            new AudioContext();


        const oscillator =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        oscillator.frequency.value =
            1000;


        oscillator.type =
            "sine";


        gain.gain.value =
            0.15;


        oscillator.connect(gain);

        gain.connect(
            ctx.destination
        );


        oscillator.start();


        oscillator.stop(
            ctx.currentTime + 0.12
        );

    }
    catch (e) {}
}


function beepWarning() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const ctx =
            new AudioContext();


        const oscillator =
            ctx.createOscillator();


        const gain =

        oscillator.frequency.value =

        oscillator.type =
            "sine";


        gain.gain.value =
            0.12;


        oscillator.connect(gain);

        gain.connect(
            ctx.destination
        );


        oscillator.start();


        oscillator.stop(
            ctx.currentTime + 0.18
        );

    }
    catch (e) {}
}


function beepError() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const ctx =
            new AudioContext();


        const oscillator =
            ctx.createOscillator();


        const gain =

        gain.connect(
            ctx.destination
        );


        oscillator.start();


        oscillator.stop(
            ctx.currentTime + 0.25
        );

    }
    catch (e) {}
}

   ESEMÉNYKEZELÉS

window.addEventListener(
    "DOMContentLoaded",
    () => {


        /* EREDETI */

        applyDoneStyles();

        updateButtonsVisibilityFromExcel();


        /* ====================================================
           TÖMEGES ELLENŐRZÉS
           ==================================================== */

        document
            .getElementById(
                "massCheckButton"
            )
            .addEventListener(
                "click",
                openMassCheck
            );


        /* ====================================================
           BEZÁRÁS
           ==================================================== */

        document
            .getElementById(
                "closeMassCheck"
            )
            .addEventListener(
                "click",
                closeMassCheck
            );


        /* ====================================================
           VISSZA
           ==================================================== */

        document
            .getElementById(
                "backButton"
            )
            .addEventListener(
                "click",
                () => {

                    window.location.href =
                        "arukiadas.html";

                }
            );


        /* ====================================================
           FRISSÍT
           ==================================================== */

        document
            .getElementById(
                "refreshButton"
            )
            .addEventListener(
                "click",
                () => {

                    const ok =
                        confirm(
                            "Biztosan törlöd az összes jelölést és beolvasott kódot?"
                        );


                    if (!ok) {

                        return;
                    }


                    DONE_KEYS.forEach(
                        k =>
                            localStorage.removeItem(k)
                    );


                    /*
                     * Minden SZ túra scanned listája
                     */

                    Object.keys(
                        sessionStorage
                    ).forEach(key => {

                        if (
                            key.startsWith("SZ-") &&
                            key.endsWith(
                                "_scannedList"
                            )
                        ) {

                            sessionStorage.removeItem(
                                key
                            );
                        }

                    });


                    applyDoneStyles();

                }
            );

    }
);
