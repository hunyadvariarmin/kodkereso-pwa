<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Számít túrák</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
}

body {
    position: relative;
}

/* =========================
   FŐOLDAL
   ========================= */

#mainPage {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    padding-top: 18px;
    padding-bottom: 105px;
}

#title {
    font-size: 27px;
    font-weight: bold;
    color: #ffd800;
    text-align: center;
    margin-bottom: 16px;
}

/* =========================
   TÚRAGOMBOK
   ========================= */

#buttonsContainer {
    width: 100%;
    max-width: 700px;
    padding: 0 10px;

    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;

    overflow-y: auto;
    overflow-x: hidden;

    flex: 1;
    align-content: start;
}

.tourButton {
    width: 100%;
    min-width: 0;

    padding: 16px 6px;

    font-size: 20px;
    font-weight: bold;

    color: #ffd800;
    background: rgba(30, 30, 30, 0.92);

    border: 2px solid #ffd800;
    border-radius: 10px;

    cursor: pointer;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.1s ease;
}

.tourButton:hover {
    background: #ffd800;
    color: #111;
}

.tourButton:active {
    transform: scale(0.97);
}

/* Kész túra */
.tourButton.done {
    background: #159447;
    border-color: #42ef88;
    color: white;
}

.tourButton.done:hover {
    background: #1eaa53;
    color: white;
}

/* =========================
   ALSÓ GOMBOK
   ========================= */

#bottomActions {
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);

    width: 100%;
    max-width: 470px;

    display: flex;
    gap: 9px;

    padding: 0 10px;

    z-index: 10;
}

#bottomActions button {
    flex: 1 1 0;
    width: 0;
    min-width: 0;

    padding: 12px 6px;

    border: none;
    border-radius: 10px;

    font-size: 14px;
    font-weight: bold;
    line-height: 1.15;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    cursor: pointer;

    transition:
        transform 0.1s ease,
        filter 0.15s ease;
}

#bottomActions button:hover {
    filter: brightness(1.12);
}

#bottomActions button:active {
    transform: scale(0.97);
}

#backButton {
    background: #444;
    color: white;
}

#refreshButton {
    background: #1976d2;
    color: white;
}

#massCheckButton {
    background: #159447;
    color: white;
}

/* =========================
   TÖMEGES ELLENŐRZÉS MODAL
   ========================= */

#massCheckModal {
    position: fixed;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, 0.90);

    z-index: 1000;

    padding: 12px;
}

#massCheckContent {
    width: 100%;
    max-width: 680px;
    max-height: 96vh;

    overflow-y: auto;

    background: #181818;
    border: 2px solid #ffd800;
    border-radius: 16px;

    padding: 16px;

    box-shadow: 0 0 30px rgba(0, 0, 0, 0.65);

    text-align: center;
}

#massCheckTitle {
    font-size: 24px;
    font-weight: bold;
    color: #ffd800;
    margin-bottom: 14px;
}

/* =========================
   KAMERA
   ========================= */

#massReader {
    width: 100%;
    max-width: 600px;

    margin: 0 auto;

    border-radius: 12px;
    overflow: hidden;

    background: #111;
}

#massReader video {
    width: 100% !important;
    height: auto !important;
    display: block;
}

#massReader__scan_region {
    background: transparent !important;
}

#massReader__scan_region > img {
    display: none !important;
}

/* =========================
   KÉZI BEVITEL
   ========================= */

#manualInputArea {
    width: 100%;
    max-width: 600px;

    margin: 0 auto 12px;
}

#manualInputTitle {
    color: #ffd800;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 8px;
}

#manualCodeInput {
    width: 100%;

    padding: 17px 14px;

    border: 2px solid #ffd800;
    border-radius: 11px;

    background: #0f0f0f;
    color: white;

    font-size: 23px;
    font-weight: bold;

    text-align: center;

    outline: none;
}

#manualCodeInput:focus {
    box-shadow: 0 0 0 3px rgba(255, 216, 0, 0.20);
}

#manualCodeInput::placeholder {
    color: #777;
    font-size: 17px;
    font-weight: normal;
}

/* =========================
   MÓDVÁLTÓ GOMBOK
   ========================= */

#massModeButtons {
    display: flex;
    justify-content: center;
    gap: 8px;

    width: 100%;
    max-width: 600px;

    margin: 10px auto;
}

#massModeButtons button {
    flex: 1;

    padding: 10px 8px;

    border: none;
    border-radius: 9px;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;

    color: white;
}

#switchManualButton {
    background: #555;
}

#switchCameraButton {
    background: #1976d2;
}

/* =========================
   STÁTUSZ
   ========================= */

#massScanStatus {
    min-height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 8px auto;

    padding: 8px 10px;

    border-radius: 9px;

    font-size: 15px;
    font-weight: bold;

    max-width: 600px;
}

.mass-status-info {
    background: #292929;
    color: #ddd;
}

.mass-status-success {
    background: #145c32;
    color: #63ff9d;
}

.mass-status-warning {
    background: #66500a;
    color: #ffe56b;
}

.mass-status-error {
    background: #671b1b;
    color: #ff7777;
}

/* =========================
   ÖSSZESÍTÉS
   ========================= */

#massTotal {
    margin: 12px 0;

    font-size: 18px;
    font-weight: bold;

    color: white;
}

#massTotalCount {
    color: #ffd800;
}

#massSummary {
    width: 100%;
    max-width: 600px;

    margin: 0 auto 14px;

    padding: 12px;

    background: #101010;
    border-radius: 11px;

    text-align: left;
}

#massSummary h3 {
    margin: 0 0 9px;

    color: #ffd800;
    font-size: 17px;

    text-align: center;
}

#massSummaryList {
    font-size: 15px;
    line-height: 1.55;
}

.mass-summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 5px 3px;

    border-bottom: 1px solid #292929;
}

.mass-summary-row:last-child {
    border-bottom: none;
}

.mass-summary-count {
    color: #ffd800;
    font-weight: bold;
}

/* =========================
   BEZÁRÁS
   ========================= */

#closeMassCheck {
    width: 100%;
    max-width: 600px;

    padding: 12px;

    border: none;
    border-radius: 10px;

    background: #a52a2a;
    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

#closeMassCheck:hover {
    filter: brightness(1.15);
}

/* =========================
   MOBIL
   ========================= */

@media (max-width: 480px) {

    #mainPage {
        padding-top: 12px;
        padding-bottom: 95px;
    }

    #title {
        font-size: 23px;
        margin-bottom: 12px;
    }

    #buttonsContainer {
        gap: 8px;
        padding: 0 8px;
    }

    .tourButton {
        padding: 15px 4px;
        font-size: 17px;
        border-radius: 9px;
    }

    #bottomActions {
        bottom: 17px;
        gap: 7px;
        padding: 0 8px;
    }

    #bottomActions button {
        padding: 11px 4px;
        font-size: 13px;
        border-radius: 9px;
    }

    #massCheckContent {
        padding: 12px;
    }

    #massCheckTitle {
        font-size: 21px;
    }

    #manualCodeInput {
        font-size: 20px;
    }
}

@media (max-width: 360px) {

    #buttonsContainer {
        gap: 6px;
        padding: 0 6px;
    }

    .tourButton {
        padding: 13px 3px;
        font-size: 15px;
    }

    #bottomActions {
        gap: 5px;
        padding: 0 6px;
    }

    #bottomActions button {
        padding: 10px 3px;
        font-size: 11px;
    }
}
</style>
</head>

<body>

        <button class="tourButton" data-tour="SZ-1">SZ-1</button>

        <button class="tourButton" data-tour="SZ-5">SZ-5</button>
        <button class="tourButton" data-tour="SZ-7">SZ-7</button>
        <button class="tourButton" data-tour="SZ-9">SZ-9</button>

</div>


<!-- =========================
     TÖMEGES ELLENŐRZÉS
     ========================= -->

<div id="massCheckModal">

    <div id="massCheckContent">

        <div id="massCheckTitle">
            TÖMEGES ELLENŐRZÉS
        </div>

        <div id="massReader"></div>

        <div id="manualInputArea" style="display:none;">

            <div id="manualInputTitle">
                KÉZI BEVITEL / VONALKÓDOLVASÓ
            </div>

            <input
                id="manualCodeInput"
                type="text"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                placeholder="Olvasd be a kódot..."
            >

        </div>

        <div id="massModeButtons">

            <button id="switchManualButton">
                Váltás kézi bevitelre
            </button>

            <button id="switchCameraButton" style="display:none;">
                Váltás kamerára
            </button>

        </div>

        <div id="massScanStatus" class="mass-status-info">
            Kamera indítása...
        </div>

        <div id="massTotal">
            Ellenőrizve:
            <span id="massTotalCount">0</span>
            db
        </div>

        <div id="massSummary">

            <h3>Túrák összesítése</h3>

            <div id="massSummaryList">
                Nincs még beolvasott kód.
            </div>

        </div>

        <button id="closeMassCheck">
            BEZÁRÁS
        </button>

    </div>

</div>


<script>

/* =========================================================
   ALAPBEÁLLÍTÁSOK
   ========================================================= */

const EXCEL_URL =
    "https://raw.githubusercontent.com/hunyadvariarmin/kodkereso-pwa/main/1.xlsx";


/* =========================================================
   TÚRÁK
   ========================================================= */

const TOUR_NAMES = [
    "SZ-0",
    "SZ-1",
    "SZ-2",
    "SZ-3",
    "SZ-4",
    "SZ-5",
    "SZ-7",
    "SZ-9",
    "SZ-10",
    "SZ-12",
    "SZ-14",
    "SZ-15",
    "SZ-18",
    "SZ-19",
    "SZ-20",
    "SZ-21",
    "SZ-22",
    "SZ-23",
    "SZ-25",
    "SZ-26",
    "SZ-27",
    "SZ-28",
    "SZ-29",
    "SZ-30",
    "SZ-32",
    "SZ-33",
    "SZ-34",
    "SZ-35",
    "SZ-36",
    "SZ-37",
    "SZ-38",
    "SZ-40",
    "SZ-50",
    "SZ-54",
    "SZ-60",
    "SZ-70",
    "SZ-101",
    "SZ-1000"
];


/* =========================================================
   LOCAL STORAGE / SESSION STORAGE KULCSOK
   ========================================================= */

const DONE_KEYS = TOUR_NAMES.map(
    tour => "done_" + tour
);

const SCAN_KEYS = TOUR_NAMES.map(
    tour => tour + "_scannedList"
);


/* =========================================================
   EXCEL ADATOK
   ========================================================= */

let excelData = null;


/* =========================================================
   TÚRAGOMBOK KATTINTÁSA
   ========================================================= */

document.querySelectorAll(".tourButton").forEach(button => {

    button.addEventListener("click", function () {

        const tour = this.dataset.tour;

        localStorage.setItem(
            "selectedTour",
            tour
        );

        /*
         * Ha nálad a túrák külön oldalra mennek,
         * itt marad a korábbi arukiadas.html logika.
         */
        window.location.href =
            "arukiadas.html?tour=" +
            encodeURIComponent(tour);

    });

});


/* =========================================================
   KÉSZ TÚRÁK ZÖLDRE ÁLLÍTÁSA
   ========================================================= */

function applyDoneStyles() {

    document.querySelectorAll(".tourButton").forEach(button => {

        const tour = button.dataset.tour;

        if (localStorage.getItem("done_" + tour) === "true") {

            button.classList.add("done");

        } else {

            button.classList.remove("done");

        }

    });

}


/* =========================================================
   EXCEL BEOLVASÁSA
   ========================================================= */

async function loadExcel() {

    try {

        const response = await fetch(
            EXCEL_URL + "?t=" + Date.now()
        );

        if (!response.ok) {
            throw new Error("Excel betöltési hiba");
        }

        const arrayBuffer =
            await response.arrayBuffer();

        const workbook =
            XLSX.read(arrayBuffer, {
                type: "array"
            });

        const firstSheet =
            workbook.Sheets[
                workbook.SheetNames[0]
            ];

        excelData =
            XLSX.utils.sheet_to_json(
                firstSheet,
                {
                    header: 1,
                    defval: ""
                }
            );

        return excelData;

    } catch (error) {

        console.error(error);

        return null;

    }

}


/* =========================================================
   EXCEL ALAPJÁN CSAK A MEGFELELŐ TÚRÁK MUTATÁSA
   ========================================================= */

function convertTourNumber(value) {

    const number =
        Number(value);

    if (!Number.isFinite(number)) {
        return null;
    }

    let tourNumber;

    if (number >= 8000) {

        tourNumber =
            number - 8000;

    } else if (number >= 800) {

        tourNumber =
            number - 800;

    } else {

        tourNumber =
            number;

    }

    return "SZ-" + tourNumber;
}


function updateButtonsVisibilityFromExcel() {

    if (!excelData) {
        return;
    }

    const availableTours =
        new Set();

    for (const row of excelData) {

        if (!row || row.length < 3) {
            continue;
        }

        const tour =
            convertTourNumber(row[2]);

        if (tour) {
            availableTours.add(tour);
        }

    }

    document.querySelectorAll(".tourButton").forEach(button => {

        const tour =
            button.dataset.tour;

        if (availableTours.size === 0) {

            button.style.display = "";

        } else {

            button.style.display =
                availableTours.has(tour)
                    ? ""
                    : "none";

        }

    });

}


/* =========================================================
   FRISSÍTÉS
   ========================================================= */

document.getElementById("refreshButton")
    .addEventListener("click", async function () {

        const confirmed =
            confirm(
                "Biztosan törlöd az összes eddigi ellenőrzést?"
            );

        if (!confirmed) {
            return;
        }

        DONE_KEYS.forEach(key => {
            localStorage.removeItem(key);
        });

        SCAN_KEYS.forEach(key => {
            sessionStorage.removeItem(key);
        });

        applyDoneStyles();

        await loadExcel();

        updateButtonsVisibilityFromExcel();

        alert("Az ellenőrzések törölve.");

    });


/* =========================================================
   VISSZA
   ========================================================= */

document.getElementById("backButton")
    .addEventListener("click", function () {

        window.location.href =
            "arukiadas.html";

    });


/* =========================================================
   TÖMEGES ELLENŐRZÉS VÁLTOZÓK
   ========================================================= */

let massQrReader = null;

let massExcelData = {
    codeToTour: new Map(),
    tourCodes: new Map()
};

let massTotalScanned = 0;

let massTourCounts = {};

let massRecentlyScanned =
    new Set();

let massScannerRunning = false;


/* =========================================================
   KÓD NORMALIZÁLÁSA
   ========================================================= */

function massNormalizeCode(code) {

    return String(code || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "")
        .replace(/[–—]/g, "-");

}


/* =========================================================
   TÚRA ÁTALAKÍTÁSA
   ========================================================= */

function massConvertTour(value) {

    const number =
        Number(value);

    if (!Number.isFinite(number)) {
        return null;
    }

    let tourNumber;

    if (number >= 8000) {

        tourNumber =
            number - 8000;

    } else if (number >= 800) {

        tourNumber =
            number - 800;

    } else {

        tourNumber =
            number;

    }

    return "SZ-" + tourNumber;

}


/* =========================================================
   TÁROLT KÓDOK
   ========================================================= */

function massGetStoredList(tour) {

    try {

        const raw =
            sessionStorage.getItem(
                tour + "_scannedList"
            );

        if (!raw) {
            return [];
        }

        const parsed =
            JSON.parse(raw);

        return Array.isArray(parsed)
            ? parsed
            : [];

    } catch (error) {

        console.error(error);

        return [];

    }

}


function massSetStoredList(tour, list) {

    sessionStorage.setItem(
        tour + "_scannedList",
        JSON.stringify(list)
    );

}


/* =========================================================
   EXCEL ADATOK FELÉPÍTÉSE
   ========================================================= */

async function loadMassExcelData() {

    const data =
        await loadExcel();

    if (!data) {
        return false;
    }

    massExcelData = {
        codeToTour: new Map(),
        tourCodes: new Map()
    };

    for (const row of data) {

        if (!row || row.length < 3) {
            continue;
        }

        const code =
            massNormalizeCode(row[0]);

        const tour =
            massConvertTour(row[2]);

        if (!code || !tour) {
            continue;
        }

        massExcelData.codeToTour.set(
            code,
            tour
        );

        if (!massExcelData.tourCodes.has(tour)) {

            massExcelData.tourCodes.set(
                tour,
                new Set()
            );

        }

        massExcelData.tourCodes
            .get(tour)
            .add(code);

    }

    return true;

}


/* =========================================================
   ÖSSZESÍTÉS FRISSÍTÉSE
   ========================================================= */

function massUpdateSummary() {

    const container =
        document.getElementById(
            "massSummaryList"
        );

    const tours =
        Object.keys(massTourCounts)
            .filter(
                tour =>
                    massTourCounts[tour] > 0
            )
            .sort(
                (a, b) =>
                    a.localeCompare(
                        b,
                        undefined,
                        {
                            numeric: true
                        }
                    )
            );

    if (tours.length === 0) {

        container.innerHTML =
            "Nincs még beolvasott kód.";

        return;

    }

    container.innerHTML =
        tours.map(tour => {

            return `
                <div class="mass-summary-row">
                    <span>${tour}</span>
                    <span class="mass-summary-count">
                        ${massTourCounts[tour]} db
                    </span>
                </div>
            `;

        }).join("");

}


/* =========================================================
   STÁTUSZ
   ========================================================= */

function massSetStatus(type, text) {

    const status =
        document.getElementById(
            "massScanStatus"
        );

    status.className =
        "mass-status-" + type;

    status.textContent =
        text;

}


/* =========================================================
   HANGJELZÉSEK
   ========================================================= */

function massBeep(
    frequency,
    duration,
    type = "sine"
) {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {
            return;
        }

        const context =
            new AudioContext();

        const oscillator =
            context.createOscillator();

        const gain =
            context.createGain();

        oscillator.type =
            type;

        oscillator.frequency.value =
            frequency;

        gain.gain.value =
            0.12;

        oscillator.connect(gain);
        gain.connect(context.destination);

        oscillator.start();

        oscillator.stop(
            context.currentTime +
            duration
        );

        oscillator.onended =
            () => context.close();

    } catch (error) {

        console.warn(
            "Hangjelzés nem sikerült:",
            error
        );

    }

}


function massSuccessBeep() {

    massBeep(
        1000,
        0.12,
        "sine"
    );

}


function massWarningBeep() {

    massBeep(
        500,
        0.18,
        "sine"
    );

}


function massErrorBeep() {

    massBeep(
        250,
        0.25,
        "square"
    );

}


/* =========================================================
   TÚRA TELJESÍTÉS ELLENŐRZÉSE
   ========================================================= */

function massCheckTourDone(
    tour,
    scannedList
) {

    const expectedSet =
        massExcelData.tourCodes.get(tour);

    if (!expectedSet ||
        expectedSet.size === 0) {

        return;

    }

    const scannedSet =
        new Set(
            scannedList.map(
                massNormalizeCode
            )
        );

    let allDone = true;

    for (const code of expectedSet) {

        if (!scannedSet.has(code)) {

            allDone = false;
            break;

        }

    }

    if (allDone) {

        localStorage.setItem(
            "done_" + tour,
            "true"
        );

        applyDoneStyles();

    }

}


/* =========================================================
   KÓD FELDOLGOZÁSA
   EZT HASZNÁLJA A KAMERA ÉS A VONALKÓDOLVASÓ IS
   ========================================================= */

function processMassCode(decodedText) {

    const code =
        massNormalizeCode(decodedText);

    if (!code) {
        return;
    }

    const tour =
        massExcelData.codeToTour.get(code);

    /* ---------- NINCS AZ EXCELBEN ---------- */

    if (!tour) {

        massSetStatus(
            "error",
            "ÉRVÉNYTELEN KÓD: " + code
        );

        massErrorBeep();

        return;

    }

    /* ---------- DUPLIKÁCIÓ ---------- */

    const storedList =
        massGetStoredList(tour);

    const alreadyScanned =
        storedList.includes(code);

    if (alreadyScanned) {

        massSetStatus(
            "warning",
            "MÁR BEOLVASVA: " + code +
            " (" + tour + ")"
        );

        massWarningBeep();

        return;

    }

    /* ---------- ÚJ KÓD ---------- */

    storedList.push(code);

    massSetStoredList(
        tour,
        storedList
    );

    massTotalScanned++;

    if (!massTourCounts[tour]) {
        massTourCounts[tour] = 0;
    }

    massTourCounts[tour]++;

    document.getElementById(
        "massTotalCount"
    ).textContent =
        massTotalScanned;

    massCheckTourDone(
        tour,
        storedList
    );

    massUpdateSummary();

    massSetStatus(
        "success",
        "OK: " + code +
        " → " + tour
    );

    massSuccessBeep();

}


/* =========================================================
   KAMERA SCAN SIKERES
   ========================================================= */

function onMassScanSuccess(
    decodedText
) {

    const code =
        massNormalizeCode(decodedText);

    if (!code) {
        return;
    }

    /*
     * A kamera néha ugyanazt a kódot
     * több képkockán egymás után felismeri.
     * Ez csak a nagyon gyors ismétlést szűri.
     */

    if (massRecentlyScanned.has(code)) {
        return;
    }

    massRecentlyScanned.add(code);

    setTimeout(() => {

        massRecentlyScanned.delete(code);

    }, 1500);

    processMassCode(code);

}


/* =========================================================
   KAMERA LEÁLLÍTÁSA
   ========================================================= */

async function stopMassScanner() {

    if (!massQrReader) {
        return;
    }

    try {

        if (massScannerRunning) {

            await massQrReader.stop();

        }

    } catch (error) {

        console.warn(
            "Kamera leállítási hiba:",
            error
        );

    }

    try {

        await massQrReader.clear();

    } catch (error) {

        console.warn(
            "Kamera törlési hiba:",
            error
        );

    }

    massScannerRunning = false;

    massQrReader = null;

}


/* =========================================================
   KAMERA INDÍTÁSA
   ========================================================= */

async function startMassScanner() {

    await stopMassScanner();

    const readerElement =
        document.getElementById(
            "massReader"
        );

    readerElement.innerHTML = "";

    massQrReader =
        new Html5Qrcode(
            "massReader"
        );

    let formats = [];

    try {

        if (
            typeof Html5QrcodeSupportedFormats
            !== "undefined"
        ) {

            formats = [

                Html5QrcodeSupportedFormats.QR_CODE,

                Html5QrcodeSupportedFormats.CODE_128,

                Html5QrcodeSupportedFormats.CODE_39,

                Html5QrcodeSupportedFormats.CODE_93,

                Html5QrcodeSupportedFormats.CODABAR,

                Html5QrcodeSupportedFormats.EAN_13,

                Html5QrcodeSupportedFormats.EAN_8,

                Html5QrcodeSupportedFormats.ITF,

                Html5QrcodeSupportedFormats.UPC_A,

                Html5QrcodeSupportedFormats.UPC_E

            ];

        }

    } catch (error) {

        console.warn(
            "Vonalkód formátumok lekérése sikertelen:",
            error
        );

    }

    const config = {

        fps: 10,

        /*
         * NINCS qrbox.
         * Így nincs fehér négyzet a kameraképen.
         */

        aspectRatio: 1.0

    };

    if (formats.length > 0) {

        config.formatsToSupport =
            formats;

    }

    try {

        await massQrReader.start(

            {
                facingMode: {
                    exact: "environment"
                }
            },

            config,

            onMassScanSuccess,

            function () {
                /* scan hiba figyelmen kívül hagyva */
            }

        );

        massScannerRunning = true;

        massSetStatus(
            "info",
            "Kamera aktív – olvasd be a kódot."
        );

    } catch (error) {

        console.warn(
            "Pontos kameraindítás sikertelen:",
            error
        );

        try {

            await massQrReader.start(

                {
                    facingMode: "environment"
                },

                config,

                onMassScanSuccess,

                function () {}

            );

            massScannerRunning = true;

            massSetStatus(
                "info",
                "Kamera aktív – olvasd be a kódot."
            );

        } catch (fallbackError) {

            console.error(
                fallbackError
            );

            massScannerRunning = false;

            massSetStatus(
                "error",
                "A kamera nem indítható el."
            );

        }

    }

}


/* =========================================================
   KÉZI MÓD BEKAPCSOLÁSA
   ========================================================= */

async function switchToManualMode() {

    await stopMassScanner();

    document.getElementById(
        "massReader"
    ).style.display = "none";

    document.getElementById(
        "manualInputArea"
    ).style.display = "block";

    document.getElementById(
        "switchManualButton"
    ).style.display = "none";

    document.getElementById(
        "switchCameraButton"
    ).style.display = "block";

    massSetStatus(
        "info",
        "Kézi bevitel aktív – olvasd be a kódot."
    );

    const input =
        document.getElementById(
            "manualCodeInput"
        );

    input.value = "";

    setTimeout(() => {

        input.focus();

    }, 100);

}


/* =========================================================
   KAMERA MÓD VISSZAKAPCSOLÁSA
   ========================================================= */

async function switchToCameraMode() {

    document.getElementById(
        "manualInputArea"
    ).style.display = "none";

    document.getElementById(
        "massReader"
    ).style.display = "block";

    document.getElementById(
        "switchManualButton"
    ).style.display = "block";

    document.getElementById(
        "switchCameraButton"
    ).style.display = "none";

    massSetStatus(
        "info",
        "Kamera indítása..."
    );

    await startMassScanner();

}


/* =========================================================
   KÉZI VONALKÓDOLVASÓ
   ========================================================= */

const manualInput =
    document.getElementById(
        "manualCodeInput"
    );


manualInput.addEventListener(
    "keydown",
    function (event) {

        /*
         * A legtöbb USB/Bluetooth
         * "csipogós" vonalkódolvasó
         * ENTER-rel zárja le a bevitelt.
         */

        if (event.key !== "Enter") {
            return;
        }

        event.preventDefault();

        const code =
            manualInput.value.trim();

        manualInput.value = "";

        if (code) {

            /*
             * PONTOSAN UGYANAZ A FUNKCIÓ,
             * amit a kamera használ.
             */

            processMassCode(code);

        }

        /*
         * Azonnal visszafókuszálunk,
         * így lehet egymás után csipogtatni.
         */

        setTimeout(() => {

            manualInput.focus();

        }, 0);

    }
);


/* =========================================================
   KÉZI MÓD GOMB
   ========================================================= */

document.getElementById(
    "switchManualButton"
).addEventListener(
    "click",
    switchToManualMode
);


/* =========================================================
   KAMERA MÓD GOMB
   ========================================================= */

document.getElementById(
    "switchCameraButton"
).addEventListener(
    "click",
    switchToCameraMode
);


/* =========================================================
   TÖMEGES ELLENŐRZÉS MEGNYITÁSA
   ========================================================= */

async function openMassCheck() {

    const modal =
        document.getElementById(
            "massCheckModal"
        );

    modal.style.display =
        "flex";

    massTotalScanned = 0;

    massTourCounts = {};

    massRecentlyScanned =
        new Set();

    document.getElementById(
        "massTotalCount"
    ).textContent = "0";

    massUpdateSummary();

    /* mindig kamera módból induljon */

    document.getElementById(
        "massReader"
    ).style.display = "block";

    document.getElementById(
        "manualInputArea"
    ).style.display = "none";

    document.getElementById(
        "switchManualButton"
    ).style.display = "block";

    document.getElementById(
        "switchCameraButton"
    ).style.display = "none";

    document.getElementById(
        "manualCodeInput"
    ).value = "";

    massSetStatus(
        "info",
        "Excel adatok betöltése..."
    );

    const loaded =
        await loadMassExcelData();

    if (!loaded) {

        massSetStatus(
            "error",
            "Az Excel nem tölthető be."
        );

        return;

    }

    massSetStatus(
        "info",
        "Kamera indítása..."
    );

    await startMassScanner();

}


/* =========================================================
   TÖMEGES ELLENŐRZÉS BEZÁRÁSA
   ========================================================= */

async function closeMassCheck() {

    await stopMassScanner();

    const modal =
        document.getElementById(
            "massCheckModal"
        );

    modal.style.display =
        "none";

    document.getElementById(
        "manualCodeInput"
    ).value = "";

    /*
     * Következő megnyitáskor
     * ismét kamerával indul.
     */

    document.getElementById(
        "massReader"
    ).style.display = "block";

    document.getElementById(
        "manualInputArea"
    ).style.display = "none";

    document.getElementById(
        "switchManualButton"
    ).style.display = "block";

    document.getElementById(
        "switchCameraButton"
    ).style.display = "none";

}


/* =========================================================
   TÖMEGES GOMB
   ========================================================= */

document.getElementById(
    "massCheckButton"
).addEventListener(
    "click",
    openMassCheck
);


/* =========================================================
   BEZÁRÁS GOMB
   ========================================================= */

document.getElementById(
    "closeMassCheck"
).addEventListener(
    "click",
    closeMassCheck
);


/* =========================================================
   MODAL KATTINTÁS KÍVÜLRE
   ========================================================= */

document.getElementById(
    "massCheckModal"
).addEventListener(
    "click",
    function (event) {

        if (event.target === this) {

            closeMassCheck();

        }

    }
);


/* =========================================================
   OLDAL INDULÁSA
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        applyDoneStyles();

        const data =
            await loadExcel();

        if (data) {

            updateButtonsVisibilityFromExcel();

        }

    }
);

</script>
