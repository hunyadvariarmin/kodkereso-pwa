<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Számít túrák</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================================================
   FŐ OLDAL
   ========================================================= */

body {
    background:
        linear-gradient(
            rgba(0,0,0,0.45),
            rgba(0,0,0,0.45)
        ),
        #202020;
    color: white;
}

#mainPage {
    width: 100%;
    height: 100%;
    position: relative;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding-top: 18px;
    padding-bottom: 100px;
}

#title {
    color: #ffd800;
    font-size: 27px;
    font-weight: bold;
    text-align: center;

    margin-bottom: 15px;
}

/* =========================================================
   TÚRAGOMBOK
   ========================================================= */

#buttonsContainer {
    width: 100%;
    max-width: 700px;

    padding: 0 10px;

    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;

    flex: 1;

    overflow-y: auto;
    overflow-x: hidden;

    align-content: start;
}

.tourButton {
    width: 100%;
    min-width: 0;

    padding: 16px 6px;

    font-size: 20px;
    font-weight: bold;

    color: #ffd800;

    background: rgba(20, 20, 20, 0.88);

    border: 2px solid #ffd800;
    border-radius: 10px;

    cursor: pointer;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.1s ease;
}

.tourButton:hover {
    background: #ffd800;
    color: #111;
}

.tourButton:active {
    transform: scale(0.97);
}

.tourButton.done {
    background: #159447;
    border-color: #42ef88;
    color: white;
}

.tourButton.done:hover {
    background: #1eaa53;
    color: white;
}

/*
 * FONTOS:
 * induláskor minden gomb rejtve van.
 * Az Excel alapján csak a tényleges túrák jelennek meg.
 */
.tourButton.hiddenByExcel {
    display: none !important;
}

/* =========================================================
   ALSÓ GOMBOK
   ========================================================= */

#bottomActions {
    position: absolute;

    left: 50%;
    bottom: 22px;

    transform: translateX(-50%);

    width: 100%;
    max-width: 470px;

    padding: 0 10px;

    display: flex;
    gap: 9px;

    z-index: 50;
}

#bottomActions button {
    flex: 1 1 0;
    width: 0;
    min-width: 0;

    padding: 12px 6px;

    border: none;
    border-radius: 10px;

    font-size: 14px;
    font-weight: bold;
    line-height: 1.15;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    cursor: pointer;

    transition:
        transform 0.1s ease,
        filter 0.15s ease;
}

#bottomActions button:hover {
    filter: brightness(1.12);
}

#bottomActions button:active {
    transform: scale(0.97);
}

#backButton {
    background: #444;
    color: white;
}

#refreshButton {
    background: #1976d2;
    color: white;
}

#massCheckButton {
    background: #159447;
    color: white;
}

/* =========================================================
   TÖMEGES ELLENŐRZÉS
   ========================================================= */

#massCheckModal {
    position: fixed;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 12px;

    background: rgba(0,0,0,0.90);

    z-index: 1000;
}

#massCheckContent {
    width: 100%;
    max-width: 680px;
    max-height: 96vh;

    overflow-y: auto;

    padding: 16px;

    background: #181818;

    border: 2px solid #ffd800;
    border-radius: 16px;

    box-shadow:
        0 0 30px rgba(0,0,0,0.7);

    text-align: center;
}

#massCheckTitle {
    color: #ffd800;

    font-size: 24px;
    font-weight: bold;

    margin-bottom: 14px;
}

/* =========================================================
   KAMERA
   ========================================================= */

#massReader {
    width: 100%;
    max-width: 600px;

    margin: 0 auto;

    background: #111;

    border-radius: 12px;

    overflow: hidden;
}

#massReader video {
    width: 100% !important;
    height: auto !important;

    display: block;
}

#massReader__scan_region {
    background: transparent !important;
}

#massReader__scan_region > img {
    display: none !important;
}

/* =========================================================
   KÉZI BEVITEL
   ========================================================= */

#manualInputArea {
    width: 100%;
    max-width: 600px;

    margin: 0 auto 12px;
}

#manualInputTitle {
    color: #ffd800;

    font-size: 17px;
    font-weight: bold;

    margin-bottom: 8px;
}

#manualCodeInput {
    width: 100%;

    padding: 17px 14px;

    background: #0d0d0d;
    color: white;

    border: 2px solid #ffd800;
    border-radius: 11px;

    outline: none;

    font-size: 23px;
    font-weight: bold;

    text-align: center;
}

#manualCodeInput:focus {
    box-shadow:
        0 0 0 3px rgba(255,216,0,0.20);
}

#manualCodeInput::placeholder {
    color: #777;
    font-size: 17px;
    font-weight: normal;
}

/* =========================================================
   MÓDVÁLTÓ GOMBOK
   ========================================================= */

#massModeButtons {
    width: 100%;
    max-width: 600px;

    margin: 10px auto;

    display: flex;
    gap: 8px;
}

#massModeButtons button {
    flex: 1;

    padding: 10px 8px;

    border: none;
    border-radius: 9px;

    color: white;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
}

#switchManualButton {
    background: #555;
}

#switchCameraButton {
    background: #1976d2;
}

/* =========================================================
   STÁTUSZ
   ========================================================= */

#massScanStatus {
    width: 100%;
    max-width: 600px;

    min-height: 42px;

    margin: 8px auto;

    padding: 8px 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 9px;

    font-size: 15px;
    font-weight: bold;
}

.mass-status-info {
    background: #292929;
    color: #ddd;
}

.mass-status-success {
    background: #145c32;
    color: #63ff9d;
}

.mass-status-warning {
    background: #66500a;
    color: #ffe56b;
}

.mass-status-error {
    background: #671b1b;
    color: #ff7777;
}

/* =========================================================
   ÖSSZESÍTÉS
   ========================================================= */

#massTotal {
    margin: 12px 0;

    font-size: 18px;
    font-weight: bold;
}

#massTotalCount {
    color: #ffd800;
}

#massSummary {
    width: 100%;
    max-width: 600px;

    margin: 0 auto 14px;

    padding: 12px;

    background: #101010;

    border-radius: 11px;

    text-align: left;
}

#massSummary h3 {
    margin: 0 0 9px;

    color: #ffd800;

    font-size: 17px;

    text-align: center;
}

#massSummaryList {
    font-size: 15px;
    line-height: 1.55;
}

.mass-summary-row {
    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 5px 3px;

    border-bottom: 1px solid #292929;
}

.mass-summary-row:last-child {
    border-bottom: none;
}

.mass-summary-count {
    color: #ffd800;
    font-weight: bold;
}

/* =========================================================
   BEZÁRÁS
   ========================================================= */

#closeMassCheck {
    width: 100%;
    max-width: 600px;

    padding: 12px;

    border: none;
    border-radius: 10px;

    background: #a52a2a;
    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

#closeMassCheck:hover {
    filter: brightness(1.15);
}

/* =========================================================
   MOBIL
   ========================================================= */

@media (max-width: 480px) {

    #mainPage {
        padding-top: 12px;
        padding-bottom: 95px;
    }

    #title {
        font-size: 23px;
        margin-bottom: 12px;
    }

    #buttonsContainer {
        gap: 8px;
        padding: 0 8px;
    }

    .tourButton {
        padding: 15px 4px;
        font-size: 17px;
    }

    #bottomActions {
        bottom: 17px;
        gap: 7px;
        padding: 0 8px;
    }

    #bottomActions button {
        padding: 11px 4px;
        font-size: 13px;
    }

    #massCheckContent {
        padding: 12px;
    }

    #massCheckTitle {
        font-size: 21px;
    }

    #manualCodeInput {
        font-size: 20px;
    }
}

@media (max-width: 360px) {

    #buttonsContainer {
        gap: 6px;
        padding: 0 6px;
    }

    .tourButton {
        padding: 13px 3px;
        font-size: 15px;
    }

    #bottomActions {
        gap: 5px;
        padding: 0 6px;
    }

    #bottomActions button {
        padding: 10px 3px;
        font-size: 11px;
    }
}
</style>
</head>

<!-- =======================================================
     TÖMEGES ELLENŐRZÉS MODAL
     ======================================================= -->

<div id="massCheckModal">

    <div id="massCheckContent">

        <div id="massCheckTitle">
            TÖMEGES ELLENŐRZÉS
        </div>

        <div id="massReader"></div>

        <div
            id="manualInputArea"
            style="display:none;"
        >

            <div id="manualInputTitle">
                KÉZI BEVITEL / VONALKÓDOLVASÓ
            </div>

            <input
                id="manualCodeInput"
                type="text"

                autocapitalize="characters"
                spellcheck="false"

                placeholder="Olvasd be a kódot..."
            >

        </div>

            <button id="switchManualButton">

            <span id="massTotalCount">0</span>
            db

            </h3>

<script>

/* =========================================================
   BEÁLLÍTÁSOK
   ========================================================= */

const EXCEL_URL =
    "https://raw.githubusercontent.com/hunyadvariarmin/kodkereso-pwa/main/1.xlsx";


const TOUR_NAMES = [
    "SZ-0",
    "SZ-1",
    "SZ-2",
    "SZ-3",
    "SZ-4",
    "SZ-5",
    "SZ-7",
    "SZ-9",
    "SZ-10",
    "SZ-12",
    "SZ-14",
    "SZ-15",
    "SZ-18",
    "SZ-19",
    "SZ-20",
    "SZ-21",
    "SZ-22",
    "SZ-23",
    "SZ-25",
    "SZ-26",
    "SZ-27",
    "SZ-28",
    "SZ-29",
    "SZ-30",
    "SZ-32",
    "SZ-33",
    "SZ-34",
    "SZ-35",
    "SZ-36",
    "SZ-37",
    "SZ-38",
    "SZ-40",
    "SZ-50",
    "SZ-54",
    "SZ-60",
    "SZ-70",
    "SZ-101",
    "SZ-1000"
];


const DONE_KEYS =
    TOUR_NAMES.map(
        tour => "done_" + tour
    );


const SCAN_KEYS =
    TOUR_NAMES.map(
        tour => tour + "_scannedList"
    );


let excelData = null;


/* =========================================================
   TÚRAGOMBOK
   ========================================================= */

document.querySelectorAll(".tourButton")
    .forEach(button => {

        button.addEventListener(
            "click",
            function () {

                const tour =
                    this.dataset.tour;

                localStorage.setItem(
                    "selectedTour",
                    tour
                );

                window.location.href =
                    "arukiadas.html?tour=" +
                    encodeURIComponent(tour);

            }
        );

    });


/* =========================================================
   KÉSZ TÚRÁK
   ========================================================= */

function applyDoneStyles() {

    document.querySelectorAll(
        ".tourButton"
    ).forEach(button => {

        const tour =
            button.dataset.tour;

        if (
            localStorage.getItem(
                "done_" + tour
            ) === "true"
        ) {

            button.classList.add("done");

        } else {

            button.classList.remove("done");

        }

    });

}


/* =========================================================
   TÚRA SZÁM ÁTALAKÍTÁSA
   ========================================================= */

function convertTourNumber(value) {

    const number =
        Number(value);

    if (!Number.isFinite(number)) {
        return null;
    }

    let tourNumber;

    if (number >= 8000) {

        tourNumber =
            number - 8000;

    } else if (number >= 800) {

        tourNumber =
            number - 800;

    } else {

        tourNumber =
            number;

    }

    return "SZ-" + tourNumber;
}


/* =========================================================
   EXCEL BETÖLTÉS
   ========================================================= */

async function loadExcel() {

    try {

        const response =
            await fetch(
                EXCEL_URL +
                "?t=" +
                Date.now()
            );

        if (!response.ok) {
            throw new Error(
                "Excel betöltési hiba"
            );
        }

        const arrayBuffer =
            await response.arrayBuffer();

        const workbook =
            XLSX.read(
                arrayBuffer,
                {
                    type: "array"
                }
            );

        const sheet =
            workbook.Sheets[
                workbook.SheetNames[0]
            ];

        excelData =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    header: 1,
                    defval: ""
                }
            );

        return excelData;

    } catch (error) {

        console.error(
            "Excel hiba:",
            error
        );

        return null;

    }

}


/* =========================================================
   TÚRAGOMBOK SZŰRÉSE EXCEL ALAPJÁN
   ========================================================= */

function updateButtonsVisibilityFromExcel() {

    const buttons =
        document.querySelectorAll(
            ".tourButton"
        );

    /*
     * Először MINDEN gomb rejtve.
     * Így hibás / üres Excel esetén sem
     * jelenik meg automatikusan az összes túra.
     */

    buttons.forEach(button => {

        button.classList.add(
            "hiddenByExcel"
        );

    });

    if (!excelData) {
        return;
    }

    const availableTours =
        new Set();

    for (
        const row of excelData
    ) {

        if (
            !row ||
            row.length < 3
        ) {
            continue;
        }

        const tour =
            convertTourNumber(
                row[2]
            );

        if (
            tour &&
            TOUR_NAMES.includes(tour)
        ) {

            availableTours.add(
                tour
            );

        }

    }

    buttons.forEach(button => {

        const tour =
            button.dataset.tour;

        if (
            availableTours.has(tour)
        ) {

            button.classList.remove(
                "hiddenByExcel"
            );

        }

    });

}


/* =========================================================
   FRISSÍTÉS
   ========================================================= */

document.getElementById(
    "refreshButton"
).addEventListener(
    "click",
    async function () {

        const confirmed =
            confirm(
                "Biztosan törlöd az összes eddigi ellenőrzést?"
            );

        if (!confirmed) {
            return;
        }

        DONE_KEYS.forEach(
            key =>
                localStorage.removeItem(
                    key
                )
        );

        SCAN_KEYS.forEach(
            key =>
                sessionStorage.removeItem(
                    key
                )
        );

        applyDoneStyles();

        await loadExcel();

        updateButtonsVisibilityFromExcel();

        alert(
            "Az ellenőrzések törölve."
        );

    }
);


/* =========================================================
   VISSZA
   ========================================================= */

document.getElementById(
    "backButton"
).addEventListener(
    "click",
    function () {

        window.location.href =
            "arukiadas.html";

    }
);


/* =========================================================
   TÖMEGES ELLENŐRZÉS VÁLTOZÓK
   ========================================================= */

let massQrReader = null;

let massScannerRunning =
    false;

let massExcelData = {
    codeToTour: new Map(),
    tourCodes: new Map()
};

let massTotalScanned =
    0;

let massTourCounts =
    {};

let massRecentlyScanned =
    new Set();


/* =========================================================
   KÓD NORMALIZÁLÁS
   ========================================================= */

function massNormalizeCode(code) {

    return String(code || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "")
        .replace(/[–—]/g, "-");

}


/* =========================================================
   TÁROLT LISTA
   ========================================================= */

function massGetStoredList(tour) {

    try {

        const raw =
            sessionStorage.getItem(
                tour +
                "_scannedList"
            );

        if (!raw) {
            return [];
        }

        const list =
            JSON.parse(raw);

        return Array.isArray(list)
            ? list
            : [];

    } catch (error) {

        console.error(error);

        return [];

    }

}


function massSetStoredList(
    tour,
    list
) {

    sessionStorage.setItem(
        tour +
        "_scannedList",
        JSON.stringify(list)
    );

}


/* =========================================================
   MASS EXCEL ADATOK
   ========================================================= */

async function loadMassExcelData() {

    const data =
        await loadExcel();

    if (!data) {
        return false;
    }

    massExcelData = {
        codeToTour: new Map(),
        tourCodes: new Map()
    };

    for (
        const row of data
    ) {

        if (
            !row ||
            row.length < 3
        ) {
            continue;
        }

        const code =
            massNormalizeCode(
                row[0]
            );

        const tour =
            convertTourNumber(
                row[2]
            );

        if (
            !code ||
            !tour
        ) {
            continue;
        }

        massExcelData.codeToTour.set(
            code,
            tour
        );

        if (
            !massExcelData.tourCodes.has(
                tour
            )
        ) {

            massExcelData.tourCodes.set(
                tour,
                new Set()
            );

        }

        massExcelData.tourCodes
            .get(tour)
            .add(code);

    }

    return true;

}


/* =========================================================
   ÖSSZESÍTÉS
   ========================================================= */

function massUpdateSummary() {

    const container =
        document.getElementById(
            "massSummaryList"
        );

    const tours =
        Object.keys(
            massTourCounts
        )
        .filter(
            tour =>
                massTourCounts[tour] > 0
        )
        .sort(
            (a,b) =>
                a.localeCompare(
                    b,
                    undefined,
                    {
                        numeric: true
                    }
                )
        );

    if (
        tours.length === 0
    ) {

        container.innerHTML =
            "Nincs még beolvasott kód.";

        return;

    }

    container.innerHTML =
        tours.map(
            tour => `
                <div class="mass-summary-row">
                    <span>${tour}</span>

                    <span class="mass-summary-count">
                        ${massTourCounts[tour]} db
                    </span>
                </div>
            `
        ).join("");

}


/* =========================================================
   STÁTUSZ
   ========================================================= */

function massSetStatus(
    type,
    text
) {

    const status =
        document.getElementById(
            "massScanStatus"
        );

    status.className =
        "mass-status-" +
        type;

    status.textContent =
        text;

}


/* =========================================================
   HANGJELZÉS
   ========================================================= */

function massBeep(
    frequency,
    duration,
    type
) {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {
            return;
        }

        const context =
            new AudioContext();

        const oscillator =
            context.createOscillator();

        const gain =
            context.createGain();

        oscillator.type =
            type || "sine";

        oscillator.frequency.value =
            frequency;

        gain.gain.value =
            0.12;

        oscillator.connect(gain);

        gain.connect(
            context.destination
        );

        oscillator.start();

        oscillator.stop(
            context.currentTime +
            duration
        );

        oscillator.onended =
            function () {

                context.close();

            };

    } catch (error) {

        console.warn(
            "Beep hiba:",
            error
        );

    }

}


function massSuccessBeep() {

    massBeep(
        1000,
        0.12,
        "sine"
    );

}


function massWarningBeep() {

    massBeep(
        500,
        0.18,
        "sine"
    );

}


function massErrorBeep() {

    massBeep(
        250,
        0.25,
        "square"
    );

}


/* =========================================================
   TÚRA TELJES
   ========================================================= */

function massCheckTourDone(
    tour,
    scannedList
) {

    const expected =
        massExcelData.tourCodes.get(
            tour
        );

    if (
        !expected ||
        expected.size === 0
    ) {
        return;
    }

    const scanned =
        new Set(
            scannedList.map(
                massNormalizeCode
            )
        );

    let complete = true;

    for (
        const code of expected
    ) {

        if (
            !scanned.has(code)
        ) {

            complete = false;
            break;

        }

    }

    if (complete) {

        localStorage.setItem(
            "done_" + tour,
            "true"
        );

        applyDoneStyles();

    }

}


/* =========================================================
   KÓD FELDOLGOZÁS
   KAMERA ÉS SCANNER UGYANEZT HASZNÁLJA
   ========================================================= */

function processMassCode(
    decodedText
) {

    const code =
        massNormalizeCode(
            decodedText
        );

    if (!code) {
        return;
    }

    const tour =
        massExcelData.codeToTour.get(
            code
        );

    /* ---------------------------------
       NINCS AZ EXCELBEN
       --------------------------------- */

    if (!tour) {

        massSetStatus(
            "error",
            "ÉRVÉNYTELEN KÓD: " +
            code
        );

        massErrorBeep();

        return;

    }

    /* ---------------------------------
       DUPLIKÁCIÓ
       --------------------------------- */

    const storedList =
        massGetStoredList(
            tour
        );

    if (
        storedList.includes(code)
    ) {

        massSetStatus(
            "warning",
            "MÁR BEOLVASVA: " +
            code +
            " (" +
            tour +
            ")"
        );

        massWarningBeep();

        return;

    }

    /* ---------------------------------
       ÚJ KÓD
       --------------------------------- */

    storedList.push(code);

    massSetStoredList(
        tour,
        storedList
    );

    massTotalScanned++;

    if (
        !massTourCounts[tour]
    ) {

        massTourCounts[tour] = 0;

    }

    massTourCounts[tour]++;

    document.getElementById(
        "massTotalCount"
    ).textContent =
        massTotalScanned;

    massCheckTourDone(
        tour,
        storedList
    );

    massUpdateSummary();

    massSetStatus(
        "success",
        "OK: " +
        code +
        " → " +
        tour
    );

    massSuccessBeep();

}


/* =========================================================
   KAMERA SIKER
   ========================================================= */

function onMassScanSuccess(
    decodedText
) {

    const code =
        massNormalizeCode(
            decodedText
        );

    if (!code) {
        return;
    }

    if (
        massRecentlyScanned.has(
            code
        )
    ) {
        return;
    }

    massRecentlyScanned.add(
        code
    );

    setTimeout(
        function () {

            massRecentlyScanned.delete(
                code
            );

        },
        1500
    );

    processMassCode(code);

}


/* =========================================================
   KAMERA LEÁLLÍTÁSA
   ========================================================= */

async function stopMassScanner() {

    if (!massQrReader) {
        return;
    }

    try {

        if (massScannerRunning) {

            await massQrReader.stop();

        }

    } catch (error) {

        console.warn(
            "Kamera stop:",
            error
        );

    }

    try {

        await massQrReader.clear();

    } catch (error) {

        console.warn(
            "Kamera clear:",
            error
        );

    }

    massScannerRunning =
        false;

    massQrReader =
        null;

}


/* =========================================================
   KAMERA INDÍTÁSA
   ========================================================= */

async function startMassScanner() {

    await stopMassScanner();

    const reader =
        document.getElementById(
            "massReader"
        );

    reader.innerHTML = "";

    massQrReader =
        new Html5Qrcode(
            "massReader"
        );

    let formats = [];

    try {

        if (
            typeof Html5QrcodeSupportedFormats
            !== "undefined"
        ) {

            formats = [

                Html5QrcodeSupportedFormats.QR_CODE,

                Html5QrcodeSupportedFormats.CODE_128,

                Html5QrcodeSupportedFormats.CODE_39,

                Html5QrcodeSupportedFormats.CODE_93,

                Html5QrcodeSupportedFormats.CODABAR,

                Html5QrcodeSupportedFormats.EAN_13,

                Html5QrcodeSupportedFormats.EAN_8,

                Html5QrcodeSupportedFormats.ITF,

                Html5QrcodeSupportedFormats.UPC_A,

                Html5QrcodeSupportedFormats.UPC_E

            ];

        }

    } catch (error) {

        console.warn(error);

    }

    const config = {

        fps: 10,

        aspectRatio: 1.0

    };

    if (
        formats.length > 0
    ) {

        config.formatsToSupport =
            formats;

    }

    try {

        await massQrReader.start(

            {
                facingMode: {
                    exact: "environment"
                }
            },

            config,

            onMassScanSuccess,

            function () {}

        );

        massScannerRunning =
            true;

        massSetStatus(
            "info",
            "Kamera aktív – olvasd be a kódot."
        );

    } catch (error) {

        console.warn(
            "Első kameraindítás sikertelen:",
            error
        );

        try {

            await massQrReader.start(

                {
                    facingMode:
                        "environment"
                },

                config,

                onMassScanSuccess,

                function () {}

            );

            massScannerRunning =
                true;

            massSetStatus(
                "info",
                "Kamera aktív – olvasd be a kódot."
            );

        } catch (fallbackError) {

            console.error(
                fallbackError
            );

            massScannerRunning =
                false;

            massSetStatus(
                "error",
                "A kamera nem indítható el."
            );

        }

    }

}


/* =========================================================
   KÉZI MÓD
   ========================================================= */

async function switchToManualMode() {

    await stopMassScanner();

    document.getElementById(
        "massReader"
    ).style.display =
        "none";

    document.getElementById(
        "manualInputArea"
    ).style.display =
        "block";

    document.getElementById(
        "switchManualButton"
    ).style.display =
        "none";

    document.getElementById(
        "switchCameraButton"
    ).style.display =
        "block";

    massSetStatus(
        "info",
        "Kézi bevitel aktív – olvasd be a kódot."
    );

    const input =
        document.getElementById(
            "manualCodeInput"
        );

    input.value = "";

    setTimeout(
        function () {

            input.focus();

        },
        100
    );

}


/* =========================================================
   KAMERA VISSZA
   ========================================================= */

async function switchToCameraMode() {

    const input =
        document.getElementById(
            "manualCodeInput"
        );

    input.value = "";

    document.getElementById(
        "manualInputArea"
    ).style.display =
        "none";

    document.getElementById(
        "massReader"
    ).style.display =
        "block";

    document.getElementById(
        "switchManualButton"
    ).style.display =
        "block";

    document.getElementById(
        "switchCameraButton"
    ).style.display =
        "none";

    massSetStatus(
        "info",
        "Kamera indítása..."
    );

    await startMassScanner();

}


/* =========================================================
   SCANNER / KÉZI BEVITEL
   ========================================================= */

/*
 * A legtöbb csipogós scanner:
 *
 *   1. karakterenként "begépeli" a kódot
 *   2. ENTER-t küld
 *
 * De vannak olyanok is, amelyek nem küldenek ENTER-t.
 *
 * Ezért kétféleképpen kezeljük:
 *
 *   ENTER -> azonnali feldolgozás
 *
 *   nincs ENTER ->
 *   ha rövid ideig nem érkezik új karakter,
 *   feldolgozzuk az addigi kódot.
 */

const manualInput =
    document.getElementById(
        "manualCodeInput"
    );

let manualInputTimer =
    null;

let manualProcessing =
    false;


/* ENTER */

manualInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            clearTimeout(
                manualInputTimer
            );

            submitManualCode();

        }

    }
);


/* KARAKTEREK ÉRKEZÉSE */

manualInput.addEventListener(
    "input",
    function () {

        clearTimeout(
            manualInputTimer
        );

        const value =
            manualInput.value.trim();

        if (!value) {
            return;
        }

        /*
         * 120 ms szünet.
         *
         * A normál scanner nagyon gyorsan
         * küldi a karaktereket, ezért ez
         * gyakorlatilag a teljes kód után
         * fut le.
         */

        manualInputTimer =
            setTimeout(
                function () {

                    /*
                     * Ha az input még mindig
                     * ugyanazzal a kóddal
                     * rendelkezik, feldolgozzuk.
                     */

                    if (
                        manualInput.value.trim()
                    ) {

                        submitManualCode();

                    }

                },
                120
            );

    }
);


/* =========================================================
   KÉZI KÓD ELKÜLDÉSE
   ========================================================= */

function submitManualCode() {

    if (manualProcessing) {
        return;
    }

    const code =
        manualInput.value.trim();

    if (!code) {

        manualInput.focus();

        return;

    }

    manualProcessing =
        true;

    /*
     * Még feldolgozás előtt
     * kiürítjük az inputot,
     * így a következő scanner-kód
     * azonnal írható.
     */

    manualInput.value = "";

    /*
     * UGYANAZ a feldolgozás,
     * amit a kamera használ.
     */

    processMassCode(code);

    manualProcessing =
        false;

    /*
     * Azonnal vissza a mezőbe.
     */

    setTimeout(
        function () {

            manualInput.focus();

        },
        0
    );

}


/* =========================================================
   MÓDVÁLTÁS GOMBOK
   ========================================================= */

document.getElementById(
    "switchManualButton"
).addEventListener(
    "click",
    switchToManualMode
);


document.getElementById(
    "switchCameraButton"
).addEventListener(
    "click",
    switchToCameraMode
);


/* =========================================================
   TÖMEGES ELLENŐRZÉS MEGNYITÁSA
   ========================================================= */

async function openMassCheck() {

    const modal =
        document.getElementById(
            "massCheckModal"
        );

    modal.style.display =
        "flex";

    massTotalScanned =
        0;

    massTourCounts =
        {};

    massRecentlyScanned =
        new Set();

    manualProcessing =
        false;

    clearTimeout(
        manualInputTimer
    );

    document.getElementById(
        "massTotalCount"
    ).textContent =
        "0";

    document.getElementById(
        "manualCodeInput"
    ).value =
        "";

    /*
     * Mindig kamerával indul.
     */

    document.getElementById(
        "massReader"
    ).style.display =
        "block";

    document.getElementById(
        "manualInputArea"
    ).style.display =
        "none";

    document.getElementById(
        "switchManualButton"
    ).style.display =
        "block";

    document.getElementById(
        "switchCameraButton"
    ).style.display =
        "none";

    massUpdateSummary();

    massSetStatus(
        "info",
        "Excel adatok betöltése..."
    );

    const loaded =
        await loadMassExcelData();

    if (!loaded) {

        massSetStatus(
            "error",
            "Az Excel nem tölthető be."
        );

        return;

    }

    massSetStatus(
        "info",
        "Kamera indítása..."
    );

    await startMassScanner();

}


/* =========================================================
   TÖMEGES ELLENŐRZÉS BEZÁRÁSA
   ========================================================= */

async function closeMassCheck() {

    clearTimeout(
        manualInputTimer
    );

    await stopMassScanner();

    const modal =
        document.getElementById(
            "massCheckModal"
        );

    modal.style.display =
        "none";

    document.getElementById(
        "manualCodeInput"
    ).value =
        "";

    /*
     * Következő megnyitáskor
     * ismét kamera legyen.
     */

    document.getElementById(
        "massReader"
    ).style.display =
        "block";

    document.getElementById(
        "manualInputArea"
    ).style.display =
        "none";

    document.getElementById(
        "switchManualButton"
    ).style.display =
        "block";

    document.getElementById(
        "switchCameraButton"
    ).style.display =
        "none";

}


/* =========================================================
   TÖMEGES ELLENŐRZÉS GOMB
   ========================================================= */

document.getElementById(
    "massCheckButton"
).addEventListener(
    "click",
    openMassCheck
);


/* =========================================================
   BEZÁRÁS
   ========================================================= */

document.getElementById(
    "closeMassCheck"
).addEventListener(
    "click",
    closeMassCheck
);


/* =========================================================
   MODAL KÍVÜL KATTINTÁS
   ========================================================= */

document.getElementById(
    "massCheckModal"
).addEventListener(
    "click",
    function (event) {

        if (
            event.target === this
        ) {

            closeMassCheck();

        }

    }
);


/* =========================================================
   OLDAL INDÍTÁSA
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        /*
         * FONTOS:
         * először minden túragomb rejtve.
         */

        document.querySelectorAll(
            ".tourButton"
        ).forEach(button => {

            button.classList.add(
                "hiddenByExcel"
            );

        });

        applyDoneStyles();

        const data =
            await loadExcel();

        if (data) {

            updateButtonsVisibilityFromExcel();

        }

    }
);

</script>
