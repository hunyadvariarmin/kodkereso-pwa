<script>

/* ============================================================
   ALAPBEÁLLÍTÁSOK
   ============================================================ */

const XLSX_URL =
    "https://raw.githubusercontent.com/hunyadvariarmin/kodkereso-pwa/main/1.xlsx";


/* ============================================================
   DONE KULCSOK
   ============================================================ */

const DONE_KEYS = [

    "done_SZ-1000",
    "done_SZ-2",
    "done_SZ-3",
    "done_SZ-4",
    "done_SZ-0",
    "done_SZ-7",
    "done_SZ-9",
    "done_SZ-10",
    "done_SZ-101",
    "done_SZ-1",
    "done_SZ-5",
    "done_SZ-12",
    "done_SZ-14",
    "done_SZ-15",
    "done_SZ-18",
    "done_SZ-19",
    "done_SZ-20",
    "done_SZ-21",
    "done_SZ-22",
    "done_SZ-23",
    "done_SZ-25",
    "done_SZ-26",
    "done_SZ-27",
    "done_SZ-28",
    "done_SZ-29",
    "done_SZ-30",
    "done_SZ-32",
    "done_SZ-33",
    "done_SZ-34",
    "done_SZ-35",
    "done_SZ-36",
    "done_SZ-37",
    "done_SZ-38",
    "done_SZ-40",
    "done_SZ-50",
    "done_SZ-60",
    "done_SZ-70",
    "done_SZ-54"

];


/* ============================================================
   SESSION STORAGE KULCS
   ============================================================ */

function getScanKey(tour) {

    return tour + "_scannedList";

}


/* ============================================================
   KÓD NORMALIZÁLÁSA
   ============================================================ */

function normalizeCode(value) {

    if (value == null) {
        return "";
    }

    return String(value)
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "")
        .replace(/[–—]/g, "-");

}


/* ============================================================
   EXCEL TÚRA ÁTALAKÍTÁSA
   ============================================================

   SZ-2
   SZ-802  → SZ-2

   SZ-23
   SZ-823  → SZ-23

   SZ-35
   SZ-835  → SZ-35

   SZ-60
   SZ-860  → SZ-60

   SZ-101
   SZ-8101 → SZ-101
   ============================================================ */

function convertExcelTour(value) {

    const norm =
        normalizeCode(value);

    if (!norm.startsWith("SZ-")) {
        return null;
    }

    const numStr =
        norm.slice(3);

    if (!/^\d+$/.test(numStr)) {
        return null;
    }

    const rawNum =
        parseInt(
            numStr,
            10
        );

    if (isNaN(rawNum)) {
        return null;
    }

    let baseNum;

    if (rawNum >= 8000) {

        baseNum =
            rawNum - 8000;

    }
    else if (rawNum >= 800) {

        baseNum =
            rawNum - 800;

    }
    else {

        baseNum =
            rawNum;

    }

    return "SZ-" + baseNum;

}


/* ============================================================
   EXCEL ADATOK
   ============================================================ */

let massExcelData = null;


/* ============================================================
   EXCEL BETÖLTÉSE
   ============================================================ */

async function loadMassExcelData() {

    if (massExcelData !== null) {
        return massExcelData;
    }

    const response =
        await fetch(
            XLSX_URL,
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {
        throw new Error(
            "Nem sikerült betölteni az Excel fájlt."
        );
    }

    const buffer =
        await response.arrayBuffer();

    const workbook =
        XLSX.read(
            buffer,
            {
                type: "array"
            }
        );

    const sheet =
        workbook.Sheets[
            workbook.SheetNames[0]
        ];

    const data =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                header: 1
            }
        );


    const codeToTour =
        new Map();

    const tourCodes =
        new Map();


    for (
        let i = 1;
        i < data.length;
        i++
    ) {

        const row =
            data[i] || [];


        /* A oszlop = QR */

        const code =
            normalizeCode(
                row[0]
            );


        /* C oszlop = túra */

        const rawTour =
            row[2];


        if (
            !code ||
            rawTour == null
        ) {
            continue;
        }


        const tour =
            convertExcelTour(
                rawTour
            );


        if (!tour) {
            continue;
        }


        codeToTour.set(
            code,
            tour
        );


        if (
            !tourCodes.has(tour)
        ) {

            tourCodes.set(
                tour,
                new Set()
            );

        }


        tourCodes
            .get(tour)
            .add(code);

    }


    massExcelData = {

        codeToTour,
        tourCodes

    };


    return massExcelData;

}


/* ============================================================
   VAN-E BEOLVASOTT ADAT?
   ============================================================

   EZ A FONTOS JAVÍTÁS.

   Nem az Excel alapján mutatjuk a túrákat.

   Csak akkor jelenik meg egy túra,
   ha a sessionStorage-ban ténylegesen
   van legalább egy beolvasott kódja.
   ============================================================ */

function getToursWithScannedData() {

    const tours =
        new Set();


    Object.keys(
        sessionStorage
    ).forEach(
        key => {

            if (
                !key.startsWith("SZ-")
            ) {
                return;
            }

            if (
                !key.endsWith(
                    "_scannedList"
                )
            ) {
                return;
            }


            const tour =
                key.replace(
                    "_scannedList",
                    ""
                );


            try {

                const stored =
                    sessionStorage.getItem(
                        key
                    );

                if (!stored) {
                    return;
                }


                const parsed =
                    JSON.parse(
                        stored
                    );


                if (
                    Array.isArray(parsed) &&
                    parsed.length > 0
                ) {

                    tours.add(
                        tour.toUpperCase()
                    );

                }

            }
            catch (e) {

                console.warn(
                    "Hibás scannedList:",
                    key,
                    e
                );

            }

        }
    );


    return tours;

}


/* ============================================================
   TÚRAGOMBOK MEGJELENÍTÉSE
   ============================================================ */

function updateButtonsVisibility() {

    const scannedTours =
        getToursWithScannedData();


    const buttons =
        document.querySelectorAll(
            "#buttonsContainer button"
        );


    buttons.forEach(
        btn => {

            const code =
                btn.getAttribute(
                    "data-code"
                );


            if (!code) {
                return;
            }


            const tour =
                code.toUpperCase();


            /*
             * Csak akkor látszik,
             * ha van hozzá beolvasott adat.
             */

            if (
                scannedTours.has(tour)
            ) {

                btn.style.display =
                    "";

            }
            else {

                btn.style.display =
                    "none";

            }

        }
    );

}


/* ============================================================
   DONE STÍLUS
   ============================================================ */

function applyDoneStyles() {

    const buttons =
        document.querySelectorAll(
            "#buttonsContainer button"
        );


    buttons.forEach(
        btn => {

            btn.style.backgroundColor =
                "rgba(0,0,0,0.4)";

            btn.style.borderColor =
                "#FFD700";

            btn.style.color =
                "#FFD700";

        }
    );


    DONE_KEYS.forEach(
        key => {

            if (
                localStorage.getItem(
                    key
                ) !== "true"
            ) {
                return;
            }


            const code =
                key.replace(
                    "done_",
                    ""
                );


            const btn =
                document.querySelector(
                    `button[data-code="${code}"]`
                );


            if (btn) {

                btn.style.backgroundColor =
                    "rgba(0,128,0,0.7)";

                btn.style.borderColor =
                    "#00ff00";

                btn.style.color =
                    "#ffffff";

            }

        }
    );

}


/* ============================================================
   TÖMEGES ELLENŐRZÉS
   ============================================================ */

let html5QrCode = null;

let massCheckRunning =
    false;

let massTotalScanned =
    0;

let massTourCounts = {};

let massRecentlyScanned =
    new Set();


/* ============================================================
   ÖSSZESÍTÉS ÚJRASZÁMOLÁSA
   ============================================================ */

function rebuildMassStatistics() {

    massTotalScanned = 0;

    massTourCounts = {};


    Object.keys(
        sessionStorage
    ).forEach(
        key => {

            if (
                !key.startsWith("SZ-") ||
                !key.endsWith("_scannedList")
            ) {
                return;
            }


            try {

                const stored =
                    sessionStorage.getItem(
                        key
                    );


                if (!stored) {
                    return;
                }


                const parsed =
                    JSON.parse(
                        stored
                    );


                if (
                    !Array.isArray(parsed)
                ) {
                    return;
                }


                const tour =
                    key.replace(
                        "_scannedList",
                        ""
                    );


                const count =
                    parsed.length;


                if (count > 0) {

                    massTourCounts[tour] =
                        count;

                    massTotalScanned +=
                        count;

                }

            }
            catch (e) {}

        }
    );

}


/* ============================================================
   TÖMEGES ELLENŐRZÉS MEGNYITÁSA
   ============================================================ */

async function openMassCheck() {

    const modal =
        document.getElementById(
            "massCheckModal"
        );


    const status =
        document.getElementById(
            "scanStatus"
        );


    modal.style.display =
        "block";


    status.className =
        "status-info";


    status.textContent =
        "Excel adatok betöltése...";


    try {

        await loadMassExcelData();

    }
    catch (error) {

        console.error(
            error
        );


        status.className =
            "status-error";


        status.textContent =
            "❌ Nem sikerült betölteni az Excel fájlt.";

        return;

    }


    rebuildMassStatistics();

    massRecentlyScanned =
        new Set();


    updateMassSummary();


    status.className =
        "status-info";


    status.textContent =
        "📷 Kamera indítása...";


    await startMassScanner();

}


/* ============================================================
   KAMERA INDÍTÁSA
   ============================================================ */

async function startMassScanner() {

    massCheckRunning =
        false;


    if (html5QrCode) {

        try {
            await html5QrCode.stop();
        }
        catch (e) {}

        try {
            html5QrCode.clear();
        }
        catch (e) {}

        html5QrCode =
            null;

    }


    const reader =
        document.getElementById(
            "reader"
        );


    reader.innerHTML =
        "";


    html5QrCode =
        new Html5Qrcode(
            "reader"
        );


    const config = {

        fps: 10,

        qrbox:
            function(
                viewfinderWidth,
                viewfinderHeight
            ) {

                const size =
                    Math.floor(
                        Math.min(
                            viewfinderWidth,
                            viewfinderHeight
                        ) * 0.70
                    );


                return {

                    width: size,
                    height: size

                };

            },

        aspectRatio: 1.0

    };


    try {

        /*
         * Először lekérjük a kamerákat.
         */

        const cameras =
            await Html5Qrcode.getCameras();


        if (
            !cameras ||
            cameras.length === 0
        ) {

            throw new Error(
                "Nem található kamera."
            );

        }


        /*
         * Megpróbáljuk megtalálni
         * a hátsó kamerát.
         */

        let selectedCamera =
            cameras[0];


        const backCamera =
            cameras.find(
                camera => {

                    const label =
                        (
                            camera.label ||
                            ""
                        ).toLowerCase();


                    return (
                        label.includes("back") ||
                        label.includes("rear") ||
                        label.includes("environment") ||
                        label.includes("hát") ||
                        label.includes("hátsó")
                    );

                }
            );


        if (backCamera) {

            selectedCamera =
                backCamera;

        }


        await html5QrCode.start(

            selectedCamera.id,

            config,

            onMassScanSuccess,

            function() {
                /*
                 * Sikertelen képkocka
                 * esetén nincs teendő.
                 */
            }

        );


        massCheckRunning =
            true;


        const status =
            document.getElementById(
                "scanStatus"
            );


        status.className =
            "status-info";


        status.textContent =
            "📷 Keresem a QR-kódot...";


    }
    catch (error) {

        console.error(
            "Kamera indítási hiba:",
            error
        );


        massCheckRunning =
            false;


        const status =
            document.getElementById(
                "scanStatus"
            );


        status.className =
            "status-error";


        status.textContent =
            "❌ Nem sikerült elindítani a kamerát. Ellenőrizd a kameraengedélyt.";

    }

}


/* ============================================================
   QR BEOLVASÁSA
   ============================================================ */

function onMassScanSuccess(
    decodedText
) {

    if (
        !massCheckRunning
    ) {
        return;
    }


    const code =
        normalizeCode(
            decodedText
        );


    if (!code) {
        return;
    }


    /*
     * A kamera ugyanazt a QR-t
     * rövid idő alatt többször felismerheti.
     */

    if (
        massRecentlyScanned.has(code)
    ) {
        return;
    }


    massRecentlyScanned.add(
        code
    );


    setTimeout(
        () => {

            massRecentlyScanned.delete(
                code
            );

        },
        1500
    );


    processMassCode(
        code
    );

}


/* ============================================================
   QR FELDOLGOZÁSA
   ============================================================ */

function processMassCode(
    code
) {

    const status =
        document.getElementById(
            "scanStatus"
        );


    const data =
        massExcelData;


    if (!data) {

        status.className =
            "status-error";

        status.textContent =
            "❌ Az Excel adatok még nincsenek betöltve.";

        beepError();

        return;

    }


    /*
     * A oszlop alapján keressük meg
     * a túrát.
     */

    const tour =
        data.codeToTour.get(
            code
        );


    /* ========================================================
       NINCS TALÁLAT
       ======================================================== */

    if (!tour) {

        status.className =
            "status-error";

        status.textContent =
            "❌ NEM TALÁLHATÓ: " +
            code;

        beepError();

        return;

    }


    const scanKey =
        getScanKey(
            tour
        );


    let scannedList =
        [];


    try {

        const stored =
            sessionStorage.getItem(
                scanKey
            );


        if (stored) {

            const parsed =
                JSON.parse(
                    stored
                );


            if (
                Array.isArray(parsed)
            ) {

                scannedList =
                    parsed;

            }

        }

    }
    catch (e) {

        console.error(
            "Scanned lista olvasási hiba:",
            e
        );

    }


    /*
     * Megnézzük, hogy már benne van-e.
     */

    const alreadyScanned =
        scannedList.some(
            item =>
                normalizeCode(item) === code
        );


    if (alreadyScanned) {

        status.className =
            "status-info";

        status.textContent =
            "⚠ MÁR ELLENŐRIZVE: " +
            code +
            " › " +
            tour;

        beepWarning();

        return;

    }


    /* ========================================================
       ÚJ KÓD
       ======================================================== */

    scannedList.push(
        code
    );


    sessionStorage.setItem(

        scanKey,

        JSON.stringify(
            scannedList
        )

    );


    /*
     * Statisztika frissítése.
     */

    massTotalScanned++;


    if (
        !massTourCounts[tour]
    ) {

        massTourCounts[tour] =
            0;

    }


    massTourCounts[tour]++;


    /*
     * Megnézzük, kész-e a túra.
     */

    checkMassTourDone(
        tour,
        scannedList
    );


    /*
     * A túragombokat is
     * azonnal frissítjük.
     */

    updateButtonsVisibility();

    applyDoneStyles();


    updateMassSummary();


    status.className =
        "status-success";


    status.textContent =
        "✓ " +
        code +
        " › " +
        tour;


    beepSuccess();

}


/* ============================================================
   TÚRA KÉSZ-E?
   ============================================================ */

function checkMassTourDone(
    tour,
    scannedList
) {

    if (!massExcelData) {
        return;
    }


    const tourCodes =
        massExcelData.tourCodes.get(
            tour
        );


    if (!tourCodes) {
        return;
    }


    const scannedSet =
        new Set(
            scannedList.map(
                code =>
                    normalizeCode(code)
            )
        );


    let allDone =
        true;


    for (
        const code
        of tourCodes
    ) {

        if (
            !scannedSet.has(code)
        ) {

            allDone =
                false;

            break;

        }

    }


    if (allDone) {

        localStorage.setItem(
            "done_" + tour,
            "true"
        );


        applyDoneStyles();

    }

}


/* ============================================================
   ÖSSZESÍTÉS
   ============================================================ */

function updateMassSummary() {

    const totalElement =
        document.getElementById(
            "massTotalCount"
        );


    totalElement.textContent =
        massTotalScanned;


    const summary =
        document.getElementById(
            "summaryList"
        );


    const tours =
        Object.keys(
            massTourCounts
        ).sort(
            (a, b) => {

                const na =
                    parseInt(
                        a.replace(
                            "SZ-",
                            ""
                        ),
                        10
                    );


                const nb =
                    parseInt(
                        b.replace(
                            "SZ-",
                            ""
                        ),
                        10
                    );


                return na - nb;

            }
        );


    if (
        tours.length === 0
    ) {

        summary.innerHTML =
            "Nincs még beolvasott kód.";

        return;

    }


    summary.innerHTML =
        "";


    tours.forEach(
        tour => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "summaryRow";


            const tourSpan =
                document.createElement(
                    "span"
                );


            tourSpan.className =
                "summaryTour";


            tourSpan.textContent =
                tour;


            const countSpan =
                document.createElement(
                    "span"
                );


            countSpan.className =
                "summaryCount";


            countSpan.textContent =
                massTourCounts[tour] +
                " db";


            row.appendChild(
                tourSpan
            );


            row.appendChild(
                countSpan
            );


            summary.appendChild(
                row
            );

        }
    );

}


/* ============================================================
   KAMERA LEÁLLÍTÁSA
   ============================================================ */

async function stopMassScanner() {

    massCheckRunning =
        false;


    if (!html5QrCode) {
        return;
    }


    try {

        await html5QrCode.stop();

    }
    catch (e) {

        console.warn(
            "Kamera leállítás:",
            e
        );

    }


    try {

        html5QrCode.clear();

    }
    catch (e) {}


    html5QrCode =
        null;

}


/* ============================================================
   MODAL BEZÁRÁSA
   ============================================================ */

async function closeMassCheck() {

    await stopMassScanner();


    document.getElementById(
        "massCheckModal"
    ).style.display =
        "none";


    document.getElementById(
        "reader"
    ).innerHTML =
        "";


    const status =
        document.getElementById(
            "scanStatus"
        );


    status.className =
        "status-info";


    status.textContent =
        "Kamera leállítva.";

}


/* ============================================================
   HANG - SIKER
   ============================================================ */

function beepSuccess() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const ctx =
            new AudioContext();


        const oscillator =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        oscillator.frequency.value =
            1000;


        oscillator.type =
            "sine";


        gain.gain.value =
            0.15;


        oscillator.connect(
            gain
        );


        gain.connect(
            ctx.destination
        );


        oscillator.start();


        oscillator.stop(
            ctx.currentTime +
            0.12
        );

    }
    catch (e) {}

}


/* ============================================================
   HANG - FIGYELMEZTETÉS
   ============================================================ */

function beepWarning() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const ctx =
            new AudioContext();


        const oscillator =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        oscillator.frequency.value =
            500;


        oscillator.type =
            "sine";


        gain.gain.value =
            0.12;


        oscillator.connect(
            gain
        );


        gain.connect(
            ctx.destination
        );


        oscillator.start();


        oscillator.stop(
            ctx.currentTime +
            0.18
        );

    }
    catch (e) {}

}


/* ============================================================
   HANG - HIBA
   ============================================================ */

function beepError() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const ctx =
            new AudioContext();


        const oscillator =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        oscillator.frequency.value =
            250;


        oscillator.type =
            "square";


        gain.gain.value =
            0.15;


        oscillator.connect(
            gain
        );


        gain.connect(
            ctx.destination
        );


        oscillator.start();


        oscillator.stop(
            ctx.currentTime +
            0.25
        );

    }
    catch (e) {}

}


/* ============================================================
   OLDAL INDÍTÁSA
   ============================================================ */

window.addEventListener(
    "DOMContentLoaded",
    () => {


        /*
         * Először minden túrát elrejtünk,
         * majd csak azokat mutatjuk,
         * amelyekhez van adat.
         */

        updateButtonsVisibility();


        applyDoneStyles();


        /*
         * TÖMEGES ELLENŐRZÉS
         */

        document
            .getElementById(
                "massCheckButton"
            )
            .addEventListener(
                "click",
                openMassCheck
            );


        /*
         * BEZÁRÁS
         */

        document
            .getElementById(
                "closeMassCheck"
            )
            .addEventListener(
                "click",
                closeMassCheck
            );


        /*
         * VISSZA
         */

        document
            .getElementById(
                "backButton"
            )
            .addEventListener(
                "click",
                () => {

                    window.location.href =
                        "arukiadas.html";

                }
            );


        /*
         * FRISSÍT
         */

        document
            .getElementById(
                "refreshButton"
            )
            .addEventListener(
                "click",
                () => {


                    const ok =
                        confirm(
                            "Biztosan törlöd az összes jelölést és beolvasott kódot?"
                        );


                    if (!ok) {
                        return;
                    }


                    /*
                     * DONE törlése.
                     */

                    DONE_KEYS.forEach(
                        key => {

                            localStorage.removeItem(
                                key
                            );

                        }
                    );


                    /*
                     * MINDEN SZ-xx_scannedList
                     * törlése.
                     */

                    Object.keys(
                        sessionStorage
                    ).forEach(
                        key => {

                            if (
                                key.startsWith("SZ-") &&
                                key.endsWith(
                                    "_scannedList"
                                )
                            ) {

                                sessionStorage.removeItem(
                                    key
                                );

                            }

                        }
                    );


                    /*
                     * Képernyő frissítése.
                     */

                    massTotalScanned =
                        0;

                    massTourCounts =
                        {};


                    updateMassSummary();

                    updateButtonsVisibility();

                    applyDoneStyles();

                }
            );


        /*
         * Ha másik oldalról visszatérünk
         * és a sessionStorage változott,
         * a gombok frissüljenek.
         */

        window.addEventListener(
            "pageshow",
            () => {

                updateButtonsVisibility();

                applyDoneStyles();

            }
        );

    }
);

</script>
